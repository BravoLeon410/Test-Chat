<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; --red: #ff4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }
        
        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        .screen.active { display: flex; }

        /* Поля ввода */
        .input-box { position: relative; width: 100%; margin-bottom: 12px; }
        input { width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 15px 50px 15px 20px; border-radius: 30px; color: #fff; outline: none; font-size: 16px; }
        input:focus { border-color: var(--accent); }
        .eye { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--gray); font-size: 18px; cursor: pointer; }

        .btn { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 30px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
        .btn:active { transform: scale(0.96); }

        /* Плюсик — Идеальная центровка */
        .fab { 
            position: fixed; bottom: 100px; right: 25px; 
            width: 60px; height: 60px; background: var(--accent); 
            border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; color: #000; z-index: 100;
        }

        /* Профиль */
        .profile-card { background: var(--card); margin: 15px; padding: 20px; border-radius: 20px; }
        .prof-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .prof-label { font-size: 12px; color: var(--accent); }
        .prof-val { font-size: 16px; margin-top: 4px; }

        /* Нижняя панель */
        #bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 70px; background: #111;
            display: none; border-radius: 35px; border: 1px solid #333; z-index: 1000;
        }
        #bottom-nav.visible { display: flex; }
        .nav-btn { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--gray); }
        .nav-btn.active { color: var(--accent); }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen active" style="justify-content:center; padding:30px;">
        <h1 style="color:var(--accent); text-align:center; margin-bottom:40px;">ВСПЫШКА</h1>
        <div class="input-box"><input type="email" id="log-email" placeholder="Email"></div>
        <div class="input-box">
            <input type="password" id="log-pass" placeholder="Пароль">
            <i class="fas fa-eye eye" onclick="app.viewPass('log-pass')"></i>
        </div>
        <button class="btn" onclick="app.auth('login')">ВОЙТИ</button>
        <p onclick="app.showScreen('reg-screen')" style="text-align:center; margin-top:20px; color:var(--gray);">Создать аккаунт</p>
    </div>

    <div id="reg-screen" class="screen" style="justify-content:center; padding:30px;">
        <h2 style="color:var(--accent); text-align:center; margin-bottom:30px;">РЕГИСТРАЦИЯ</h2>
        <div class="input-box"><input type="email" id="reg-email" placeholder="Email"></div>
        <div class="input-box">
            <input type="password" id="reg-pass1" placeholder="Пароль">
            <i class="fas fa-eye eye" onclick="app.viewPass('reg-pass1')"></i>
        </div>
        <div class="input-box">
            <input type="password" id="reg-pass2" placeholder="Повторите пароль">
            <i class="fas fa-eye eye" onclick="app.viewPass('reg-pass2')"></i>
        </div>
        <button class="btn" onclick="app.auth('reg')">СОЗДАТЬ</button>
        <p onclick="app.showScreen('auth-screen')" style="text-align:center; margin-top:20px; color:var(--gray);">Назад</p>
    </div>

    <div id="list-screen" class="screen">
        <header style="padding:15px; background:var(--card); display:flex; justify-content:space-between;">
            <b style="color:var(--accent); font-size:20px;">ВСПЫШКА</b>
        </header>
        <div id="chat-list" style="flex:1; overflow-y:auto;"></div>
        <button class="fab" onclick="app.toggleModal('search-modal', true)"><i class="fas fa-plus"></i></button>
    </div>

    <div id="settings-screen" class="screen">
        <header style="padding:15px; background:var(--card);"><b style="color:var(--accent);">ПРОФИЛЬ</b></header>
        <div class="profile-card">
            <div class="prof-row">
                <div><div class="prof-label">ИМЯ</div><div id="p-name">...</div></div>
                <i class="fas fa-pen" style="color:var(--gray)" onclick="app.editName()"></i>
            </div>
            <div class="prof-row">
                <div><div class="prof-label">НИКНЕЙМ</div><div id="p-nick">@...</div></div>
                <i class="fas fa-at" style="color:var(--gray)"></i>
            </div>
            <div class="prof-row" style="border:none;">
                <div><div class="prof-label">EMAIL</div><div id="p-email">••••••••••••</div></div>
                <button onclick="app.showEmail()" style="background:none; border:1px solid var(--accent); color:var(--accent); padding:4px 8px; border-radius:10px; font-size:10px;">ПОКАЗАТЬ</button>
            </div>
        </div>
        <button onclick="app.logout()" style="margin:0 15px; color:var(--red); background:none; border:none; font-weight:bold;">ВЫЙТИ ИЗ АККАУНТА</button>
    </div>

    <div id="bottom-nav">
        <button class="nav-btn active" id="b-chats" onclick="app.tab('chats')"><i class="fas fa-comment"></i><span>ЧАТЫ</span></button>
        <button class="nav-btn" id="b-prof" onclick="app.tab('settings')"><i class="fas fa-user"></i><span>ПРОФИЛЬ</span></button>
    </div>

    <script>
        const app = {
            me: null,
            conf: { apiKey: "AIzaSyCrWLh9mCCZxeYH5sWFdCzwT3U2qgFGMEk", authDomain: "messenger-6d45a.firebaseapp.com", databaseURL: "https://messenger-6d45a-default-rtdb.firebaseio.com", projectId: "messenger-6d45a", storageBucket: "messenger-6d45a.firebasestorage.app", messagingSenderId: "871171819316", appId: "1:871171819316:web:bfa2459b42a1be9e780761" },

            showScreen(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                const nav = document.getElementById('bottom-nav');
                if(id === 'list-screen' || id === 'settings-screen') nav.classList.add('visible');
                else nav.classList.remove('visible');
            },

            viewPass(id) {
                const x = document.getElementById(id);
                x.type = x.type === "password" ? "text" : "password";
            },

            async auth(type) {
                try {
                    if(type === 'login') {
                        const e = document.getElementById('log-email').value;
                        const p = document.getElementById('log-pass').value;
                        await firebase.auth().signInWithEmailAndPassword(e, p);
                    } else {
                        const e = document.getElementById('reg-email').value;
                        const p1 = document.getElementById('reg-pass1').value;
                        const p2 = document.getElementById('reg-pass2').value;
                        if(p1 !== p2) return alert("Пароли не совпадают!");
                        await firebase.auth().createUserWithEmailAndPassword(e, p1);
                    }
                    location.reload();
                } catch(e) { alert(e.message); }
            },

            tab(t) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                if(t === 'chats') {
                    this.showScreen('list-screen');
                    document.getElementById('b-chats').classList.add('active');
                } else {
                    this.showScreen('settings-screen');
                    document.getElementById('b-prof').classList.add('active');
                    this.updateUI();
                }
            },

            updateUI() {
                if(!this.me) return;
                document.getElementById('p-name').innerText = this.me.name;
                document.getElementById('p-nick').innerText = '@' + this.me.nick;
            },

            showEmail() {
                document.getElementById('p-email').innerText = firebase.auth().currentUser.email;
            },

            logout() { 
                firebase.auth().signOut().then(() => { localStorage.clear(); location.reload(); }); 
            }
        };

        window.onload = () => {
            firebase.initializeApp(app.conf);
            firebase.auth().onAuthStateChanged(user => {
                if(user) {
                    // Здесь должна быть твоя старая логика загрузки данных из базы (app.init)
                    // Для теста просто переключаем экран:
                    app.showScreen('list-screen');
                } else {
                    app.showScreen('auth-screen');
                }
            });
        };
    </script>
</body>
</html>

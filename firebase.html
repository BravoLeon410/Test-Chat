<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; --red: #ff4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }
        
        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        .screen.active { display: flex; }
        header { padding: 15px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        
        /* Плюсик — теперь идеально ровный */
        .fab { 
            position: fixed; bottom: 100px; right: 25px; 
            width: 60px; height: 60px; background: var(--accent); 
            border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; 
            font-size: 28px; color: #000; z-index: 100;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
        }
        .fab i { line-height: 0; }

        /* Нижняя панель */
        #bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 70px; background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px); display: none; border-radius: 35px; border: 1px solid #333;
            z-index: 1000;
        }
        #bottom-nav.visible { display: flex; }
        .nav-btn { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--gray); }
        .nav-btn.active { color: var(--accent); }

        /* Профиль */
        .profile-header { text-align: center; padding: 20px; }
        .avatar-large { 
            width: 100px; height: 100px; background: var(--accent); 
            border-radius: 50%; margin: 0 auto 15px; display: flex; 
            align-items: center; justify-content: center; font-size: 40px; color: #000;
            border: 3px solid #333; cursor: pointer;
        }
        .prof-item { background: var(--card); margin: 10px 15px; padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
        .prof-info { flex: 1; }
        .prof-label { font-size: 11px; color: var(--accent); margin-bottom: 4px; }
        .prof-value { font-size: 16px; }
        .edit-icon { color: var(--gray); font-size: 14px; padding: 10px; }

        /* Сообщения и контекстное меню */
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 16px; position: relative; }
        .in { align-self: flex-start; background: #222; }
        .out { align-self: flex-end; background: var(--accent); color: #000; }
        
        .modal-delete { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: none; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="list-screen" class="screen">
        <header><b style="color:var(--accent); font-size:22px;">ВСПЫШКА</b></header>
        <div id="chat-list" style="flex:1; overflow-y:auto;"></div>
        <button class="fab" onclick="app.toggleModal('search-modal', true)"><i class="fas fa-plus"></i></button>
    </div>

    <div id="settings-screen" class="screen">
        <header><b style="color:var(--accent);">МОЙ ПРОФИЛЬ</b></header>
        <div class="profile-header">
            <div class="avatar-large" id="prof-avatar-circle" onclick="alert('Смена фото скоро!')">?</div>
            <h2 id="disp-name">Имя Фамилия</h2>
            <p id="disp-nick" style="color:var(--gray);">@nickname</p>
        </div>

        <div class="prof-item" onclick="app.editName()">
            <div class="prof-info"><div class="prof-label">ИМЯ</div><div id="prof-name-val" class="prof-value">...</div></div>
            <i class="fas fa-pen edit-icon"></i>
        </div>

        <div class="prof-item" onclick="app.editNick()">
            <div class="prof-info"><div class="prof-label">НИКНЕЙМ</div><div id="prof-nick-val" class="prof-value">...</div></div>
            <i class="fas fa-at edit-icon"></i>
        </div>

        <div class="prof-item" id="email-item">
            <div class="prof-info"><div class="prof-label">ПОЧТА</div><div id="prof-email-val" class="prof-value">••••••••••••</div></div>
            <button onclick="app.showEmail()" style="background:none; border:1px solid var(--accent); color:var(--accent); padding:5px 10px; border-radius:10px; font-size:10px;">ПОКАЗАТЬ</button>
        </div>

        <button onclick="app.logout()" style="margin: 20px 15px; padding: 15px; border-radius: 15px; background: none; border: 1px solid var(--red); color: var(--red); font-weight: bold;">ВЫЙТИ ИЗ АККАУНТА</button>
    </div>

    <div id="delete-modal" class="modal-delete" onclick="this.style.display='none'">
        <div style="background:var(--card); width:80%; border-radius:20px; padding:10px;">
            <button onclick="app.confirmDelete(false)" style="width:100%; padding:15px; background:none; color:white; border:none; border-bottom:1px solid #333;">Удалить у себя</button>
            <button onclick="app.confirmDelete(true)" id="del-all-btn" style="width:100%; padding:15px; background:none; color:var(--red); border:none;">Удалить у всех</button>
        </div>
    </div>

    <div id="bottom-nav">
        <button class="nav-btn active" id="btn-chats" onclick="app.tab('chats')"><i class="fas fa-comment"></i><span>ЧАТЫ</span></button>
        <button class="nav-btn" id="btn-settings" onclick="app.tab('settings')"><i class="fas fa-user-gear"></i><span>ПРОФИЛЬ</span></button>
    </div>

    <script>
        const app = {
            me: null, currentNick: null, selectedMsgId: null, chatContextId: null,
            // [Твой конфиг Firebase остается тут]
            conf: { apiKey: "AIzaSyCrWLh9mCCZxeYH5sWFdCzwT3U2qgFGMEk", authDomain: "messenger-6d45a.firebaseapp.com", databaseURL: "https://messenger-6d45a-default-rtdb.firebaseio.com", projectId: "messenger-6d45a", storageBucket: "messenger-6d45a.firebasestorage.app", messagingSenderId: "871171819316", appId: "1:871171819316:web:bfa2459b42a1be9e780761" },

            tab(name) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                const nav = document.getElementById('bottom-nav');
                if(name === 'chats') {
                    document.getElementById('list-screen').classList.add('active');
                    document.getElementById('btn-chats').classList.add('active');
                    nav.classList.add('visible');
                } else {
                    document.getElementById('settings-screen').classList.add('active');
                    document.getElementById('btn-settings').classList.add('active');
                    nav.classList.add('visible');
                    this.updateProfUI();
                }
            },

            updateProfUI() {
                if(!this.me) return;
                document.getElementById('prof-name-val').innerText = this.me.name;
                document.getElementById('prof-nick-val').innerText = '@' + this.me.nick;
                document.getElementById('disp-name').innerText = this.me.name;
                document.getElementById('disp-nick').innerText = '@' + this.me.nick;
                document.getElementById('prof-avatar-circle').innerText = this.me.name[0].toUpperCase();
            },

            showEmail() {
                document.getElementById('prof-email-val').innerText = firebase.auth().currentUser.email;
            },

            async editName() {
                const n = prompt("Введите новое имя:", this.me.name);
                if(n && n.trim()) {
                    await firebase.database().ref('users/' + this.me.nick).update({ name: n.trim() });
                    this.me.name = n.trim(); this.updateProfUI();
                }
            },

            async editNick() {
                const n = prompt("Новый ник (только латиница):", this.me.nick).toLowerCase().replace('@','').trim();
                if(n && n !== this.me.nick) {
                    const check = await firebase.database().ref('users/' + n).once('value');
                    if(check.exists()) return alert("Ник уже занят!");
                    // Логика переноса ника в Firebase требует обновления uids/ и переноса данных в users/
                    alert("Функция в разработке для безопасности данных.");
                }
            },

            renderMsg(me, t, msgId, chatId) {
                const b = document.getElementById('messages'), d = document.createElement('div');
                d.className = `msg ${me ? 'out' : 'in'}`; 
                d.innerText = t;
                d.id = "msg_" + msgId;

                // Долгое нажатие для удаления
                let timer;
                d.onmousedown = d.ontouchstart = () => {
                    timer = setTimeout(() => {
                        this.selectedMsgId = msgId;
                        this.chatContextId = chatId;
                        document.getElementById('delete-modal').style.display = 'flex';
                        document.getElementById('del-all-btn').style.display = me ? 'block' : 'none';
                    }, 800);
                };
                d.onmouseup = d.onmouseleave = d.ontouchend = () => clearTimeout(timer);

                b.appendChild(d); b.scrollTop = b.scrollHeight;
            },

            confirmDelete(forAll) {
                if(forAll) {
                    firebase.database().ref('chats/' + this.chatContextId + '/' + this.selectedMsgId).remove();
                }
                document.getElementById('msg_' + this.selectedMsgId).style.display = 'none';
            },

            // [Остальные функции init, openChat, send, logout — копируй из своего прошлого кода]
        };

        window.onload = () => {
            firebase.initializeApp(app.conf);
            firebase.auth().onAuthStateChanged(u => { 
                if(u) app.init(u); 
                else {
                    document.getElementById('auth-screen').classList.add('active');
                    document.getElementById('bottom-nav').classList.remove('visible');
                }
            });
        };
    </script>
</body>
</html>

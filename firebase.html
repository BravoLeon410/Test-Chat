<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; --red: #ff4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }
        
        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        .screen.active { display: flex; }
        
        /* Список чатов и Профиль теперь имеют отступ снизу под панель */
        #list-screen.active, #settings-screen.active { padding-bottom: 90px; }

        header { padding: 15px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        
        .btn { background: var(--accent); color: #000; border: none; padding: 14px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.1s; }
        .btn:active { transform: scale(0.95); }

        /* Та же нижняя панель, но скрываемая */
        #bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 70px; background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px); display: none; border-radius: 35px; border: 1px solid #333;
            z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #bottom-nav.visible { display: flex; }

        .nav-btn { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--gray); border-radius: 35px; }
        .nav-btn.active { color: var(--accent); }
        
        /* Сообщения */
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #000; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 16px; }
        .in { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }
        
        .input-bar { padding: 10px 15px 30px; background: var(--card); display: flex; gap: 10px; }
        .input-bar input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 12px; border-radius: 20px; color: #fff; outline: none; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen active" style="justify-content:center; align-items:center;">
        <div style="width:85%; text-align:center;">
            <h1 style="color:var(--accent); font-size:45px; margin-bottom:30px;">ВСПЫШКА</h1>
            <input type="email" id="log-email" placeholder="Email" style="width:100%; padding:15px; border-radius:30px; background:#1a1a1a; border:1px solid #333; color:#fff; margin-bottom:10px;">
            <input type="password" id="log-pass" placeholder="Пароль" style="width:100%; padding:15px; border-radius:30px; background:#1a1a1a; border:1px solid #333; color:#fff; margin-bottom:10px;">
            <button class="btn" onclick="app.auth('login')" style="width:100%;">ВОЙТИ</button>
            <button onclick="app.toggleScreen('reg-screen')" style="background:none; border:none; color:var(--gray); margin-top:15px;">Создать аккаунт</button>
        </div>
    </div>

    <div id="reg-screen" class="screen" style="justify-content:center; align-items:center;">
        <div style="width:85%; text-align:center;">
            <h2 style="color:var(--accent); margin-bottom:20px;">РЕГИСТРАЦИЯ</h2>
            <input type="email" id="reg-email" placeholder="Email" style="width:100%; padding:15px; border-radius:30px; background:#1a1a1a; border:1px solid #333; color:#fff; margin-bottom:10px;">
            <input type="password" id="reg-pass" placeholder="Пароль" style="width:100%; padding:15px; border-radius:30px; background:#1a1a1a; border:1px solid #333; color:#fff; margin-bottom:10px;">
            <button class="btn" onclick="app.auth('reg')" style="width:100%;">ЗАРЕГИСТРИРОВАТЬСЯ</button>
            <button onclick="app.toggleScreen('auth-screen')" style="background:none; border:none; color:var(--gray); margin-top:15px;">Назад</button>
        </div>
    </div>

    <div id="comp-screen" class="screen" style="justify-content:center; align-items:center;">
        <div style="width:85%; text-align:center;">
            <h2 style="color:var(--accent); margin-bottom:20px;">Твой Профиль</h2>
            <input type="text" id="comp-nick" placeholder="@ник" style="width:100%; padding:15px; border-radius:30px; background:#1a1a1a; border:1px solid #333; color:#fff; margin-bottom:10px;">
            <input type="text" id="comp-name" placeholder="Имя" style="width:100%; padding:15px; border-radius:30px; background:#1a1a1a; border:1px solid #333; color:#fff; margin-bottom:10px;">
            <button class="btn" onclick="app.completeProfile()" style="width:100%;">СОХРАНИТЬ</button>
        </div>
    </div>

    <div id="list-screen" class="screen">
        <header><b style="color:var(--accent); font-size:22px;">ВСПЫШКА</b></header>
        <div id="chat-list" style="flex:1; overflow-y:auto;"></div>
        <button class="btn" style="position:fixed; bottom:100px; right:25px; border-radius:50%; width:60px; height:60px; font-size:25px; z-index:100;" onclick="app.toggleModal('search-modal', true)">+</button>
    </div>

    <div id="settings-screen" class="screen">
        <header><b style="color:var(--accent); font-size:22px;">ПРОФИЛЬ</b></header>
        <div class="profile-card">
            <div class="info-label">Почта</div>
            <div id="prof-email" class="info-value">...</div>
            <div class="info-label">Имя</div>
            <div id="prof-name" class="info-value">...</div>
            <button class="btn" style="font-size:12px; padding:8px 15px;" onclick="app.editName()">Сменить имя</button>
        </div>
        <button class="btn" style="background:var(--red); color:white; margin:15px;" onclick="app.logout()">ВЫЙТИ</button>
    </div>

    <div id="chat-window" class="screen" style="z-index:2000;">
        <header>
            <div onclick="app.closeChat()" style="color:var(--accent); cursor:pointer;">‹ НАЗАД</div>
            <b id="chat-title">Чат</b>
            <div id="chat-avatar" class="avatar" style="width:35px; height:35px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#000; font-size:14px;">?</div>
        </header>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-input" placeholder="Сообщение...">
            <button class="btn" onclick="app.send()">ОК</button>
        </div>
    </div>

    <div id="bottom-nav">
        <button class="nav-btn active" id="btn-chats" onclick="app.tab('chats')">
            <i class="fas fa-comment"></i><span>ЧАТЫ</span>
        </button>
        <button class="nav-btn" id="btn-settings" onclick="app.tab('settings')">
            <i class="fas fa-user"></i><span>ПРОФИЛЬ</span>
        </button>
    </div>

    <div id="search-modal" class="modal">
        <div class="modal-box">
            <input type="text" id="search-input" placeholder="@ник..." style="width:100%; padding:12px; border-radius:10px; margin-bottom:15px; background:#1a1a1a; border:1px solid #333; color:#fff;">
            <button class="btn" onclick="app.findUser()" style="width:100%;">НАЙТИ</button>
            <button class="btn" onclick="app.toggleModal('search-modal', false)" style="width:100%; margin-top:10px; background:#222; color:#fff;">ОТМЕНА</button>
        </div>
    </div>

    <script>
        const app = {
            me: null, currentNick: null, chats: JSON.parse(localStorage.getItem('f_chats') || "{}"),
            conf: {
                apiKey: "AIzaSyCrWLh9mCCZxeYH5sWFdCzwT3U2qgFGMEk",
                authDomain: "messenger-6d45a.firebaseapp.com",
                databaseURL: "https://messenger-6d45a-default-rtdb.firebaseio.com",
                projectId: "messenger-6d45a",
                storageBucket: "messenger-6d45a.firebasestorage.app",
                messagingSenderId: "871171819316",
                appId: "1:871171819316:web:bfa2459b42a1be9e780761"
            },

            toggleScreen(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                
                // ПОКАЗЫВАЕМ ПАНЕЛЬ ТОЛЬКО НА СПИСКЕ И НАСТРОЙКАХ
                const nav = document.getElementById('bottom-nav');
                if(id === 'list-screen' || id === 'settings-screen') {
                    nav.classList.add('visible');
                } else {
                    nav.classList.remove('visible');
                }
            },

            tab(name) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                if(name === 'chats') {
                    this.toggleScreen('list-screen');
                    document.getElementById('btn-chats').classList.add('active');
                } else {
                    this.toggleScreen('settings-screen');
                    document.getElementById('btn-settings').classList.add('active');
                    this.updateProfUI();
                }
            },

            async auth(type) {
                try {
                    if(type === 'login') {
                        const e = document.getElementById('log-email').value;
                        const p = document.getElementById('log-pass').value;
                        await firebase.auth().signInWithEmailAndPassword(e, p);
                    } else {
                        const e = document.getElementById('reg-email').value;
                        const p = document.getElementById('reg-pass').value;
                        await firebase.auth().createUserWithEmailAndPassword(e, p);
                    }
                    location.reload();
                } catch(err) { alert(err.message); }
            },

            async completeProfile() {
                const ni = document.getElementById('comp-nick').value.trim().toLowerCase().replace('@','');
                const n = document.getElementById('comp-name').value.trim();
                const user = firebase.auth().currentUser;
                const check = await firebase.database().ref('users/' + ni).once('value');
                if(check.exists()) return alert("Ник занят!");
                await firebase.database().ref('users/' + ni).set({ name: n, nick: ni, uid: user.uid });
                await firebase.database().ref('uids/' + user.uid).set({ nick: ni });
                location.reload();
            },

            async init(user) {
                const uSnap = await firebase.database().ref('uids/' + user.uid).once('value');
                if(!uSnap.exists()) return this.toggleScreen('comp-screen');
                
                const myNick = uSnap.val().nick;
                const snap = await firebase.database().ref('users/' + myNick).once('value');
                this.me = snap.val();
                
                this.tab('chats');
                firebase.database().ref('inbox/' + myNick).on('child_added', s => {
                    const d = s.val(); this.chats[d.from] = { name: d.fromName };
                    this.save(); this.renderList();
                });
                this.renderList();
            },

            updateProfUI() {
                if(!this.me) return;
                document.getElementById('prof-email').innerText = firebase.auth().currentUser.email;
                document.getElementById('prof-name').innerText = this.me.name;
            },

            async editName() {
                const n = prompt("Новое имя:", this.me.name);
                if(n) {
                    await firebase.database().ref('users/' + this.me.nick).update({ name: n });
                    this.me.name = n; this.updateProfUI();
                }
            },

            renderList() {
                const l = document.getElementById('chat-list'); l.innerHTML = '';
                for(let id in this.chats) {
                    const d = document.createElement('div'); d.className = 'chat-item';
                    d.style = "padding:15px; border-bottom:1px solid #111; display:flex; align-items:center; gap:15px;";
                    d.innerHTML = `<div class="avatar" style="width:50px; height:50px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#000; font-weight:bold;">${this.chats[id].name[0].toUpperCase()}</div>
                        <div style="flex:1" onclick="app.openChat('${id}', '${this.chats[id].name}')">
                            <div style="font-weight:bold;">${this.chats[id].name}</div>
                            <div style="color:var(--gray); font-size:12px;">@${id}</div>
                        </div>`;
                    l.appendChild(d);
                }
            },

            openChat(nick, name) {
                this.currentNick = nick;
                this.toggleScreen('chat-window');
                document.getElementById('chat-title').innerText = name;
                document.getElementById('chat-avatar').innerText = name[0].toUpperCase();
                const box = document.getElementById('messages'); box.innerHTML = '';
                const id = [this.me.nick, nick].sort().join('_');
                firebase.database().ref('chats/'+id).off();
                firebase.database().ref('chats/'+id).on('child_added', s => {
                    const m = s.val(); this.renderMsg(m.f === this.me.nick, m.t);
                });
            },

            renderMsg(me, t) {
                const b = document.getElementById('messages'), d = document.createElement('div');
                d.className = `msg ${me ? 'out' : 'in'}`; d.innerText = t;
                b.appendChild(d); b.scrollTop = b.scrollHeight;
            },

            send() {
                const i = document.getElementById('m-input'), t = i.value.trim();
                if(!t || !this.currentNick) return;
                const id = [this.me.nick, this.currentNick].sort().join('_');
                firebase.database().ref('chats/'+id).push({ f: this.me.nick, t });
                firebase.database().ref('inbox/'+this.currentNick).push({ from: this.me.nick, fromName: this.me.name, text: t });
                i.value = '';
            },

            closeChat() { this.tab('chats'); },
            toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; },
            save() { localStorage.setItem('f_chats', JSON.stringify(this.chats)); },
            logout() { firebase.auth().signOut().then(() => { localStorage.clear(); location.reload(); }); }
        };

        window.onload = () => {
            firebase.initializeApp(app.conf);
            firebase.auth().onAuthStateChanged(u => { if(u) app.init(u); else app.toggleScreen('auth-screen'); });
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; --red: #ff4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }
        
        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        .screen.active { display: flex; }
        header { padding: 15px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }

        .input-box { position: relative; width: 100%; margin-bottom: 12px; }
        input { width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 15px 50px 15px 20px; border-radius: 30px; color: #fff; outline: none; font-size: 16px; }
        .eye { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--gray); cursor: pointer; }

        .btn { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 30px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }

        .fab { position: fixed; bottom: 100px; right: 25px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #000; z-index: 100; border: none; }

        .chat-item { padding: 15px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .avatar { width: 50px; height: 50px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; }

        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { 
            max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 16px; line-height: 1.4; 
            position: relative; transition: opacity 0.2s; 
            user-select: none; -webkit-user-select: none; /* Чтобы не вылазило системное копирование */
            cursor: pointer;
        }
        .msg.out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }
        .msg.in { align-self: flex-start; background: #222; color: #fff; border-bottom-left-radius: 4px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card); width: 100%; max-width: 400px; padding: 25px; border-radius: 25px; border: 1px solid #333; text-align: center; }

        #bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 70px; background: #111; display: none; border-radius: 35px; border: 1px solid #333; z-index: 1000; }
        #bottom-nav.visible { display: flex; }
        .nav-btn { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--gray); }
        .nav-btn.active { color: var(--accent); }

        .del-menu { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid #333; border-radius: 25px 25px 0 0; padding: 20px; z-index: 4000; flex-direction: column; gap: 10px; }
        .del-btn { padding: 15px; border-radius: 15px; border: none; background: #1a1a1a; color: #fff; font-weight: bold; font-size: 16px; text-align: left; }
        .del-btn.red { color: var(--red); }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen" style="justify-content:center; padding:30px;">
        <h1 style="color:var(--accent); text-align:center; margin-bottom:40px;">ВСПЫШКА</h1>
        <div class="input-box"><input type="email" id="log-email" placeholder="Email"></div>
        <div class="input-box"><input type="password" id="log-pass" placeholder="Пароль"><i class="fas fa-eye eye" onclick="app.viewPass('log-pass')"></i></div>
        <button class="btn" onclick="app.auth('login')">ВОЙТИ</button>
        <p onclick="app.showScreen('reg-screen')" style="text-align:center; margin-top:20px; color:var(--gray);">Создать аккаунт</p>
    </div>

    <div id="reg-screen" class="screen" style="justify-content:center; padding:30px;">
        <h2 style="color:var(--accent); text-align:center; margin-bottom:30px;">РЕГИСТРАЦИЯ</h2>
        <div class="input-box"><input type="email" id="reg-email" placeholder="Email"></div>
        <div class="input-box"><input type="password" id="reg-pass1" placeholder="Пароль"><i class="fas fa-eye eye" onclick="app.viewPass('reg-pass1')"></i></div>
        <div class="input-box"><input type="password" id="reg-pass2" placeholder="Повтор пароля"><i class="fas fa-eye eye" onclick="app.viewPass('reg-pass2')"></i></div>
        <button class="btn" onclick="app.auth('reg')">СОЗДАТЬ</button>
        <p onclick="app.showScreen('auth-screen')" style="text-align:center; margin-top:20px; color:var(--gray);">Назад</p>
    </div>

    <div id="list-screen" class="screen">
        <header><b style="color:var(--accent); font-size:22px;">ВСПЫШКА</b></header>
        <div id="chat-list" style="flex:1; overflow-y:auto;"></div>
        <button class="fab" onclick="app.toggleModal('search-modal', true)"><i class="fas fa-plus"></i></button>
    </div>

    <div id="chat-window" class="screen">
        <header>
            <i class="fas fa-arrow-left" onclick="app.tab('chats')"></i>
            <b id="chat-title">Чат</b>
            <div style="width:20px;"></div>
        </header>
        <div id="messages"></div>
        <div style="padding:15px; display:flex; gap:10px; background:var(--card);">
            <input type="text" id="m-input" placeholder="Сообщение..." style="margin-bottom:0;">
            <button onclick="app.send()" style="background:var(--accent); border:none; width:50px; border-radius:50%; color:#000;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="settings-screen" class="screen">
        <header><b style="color:var(--accent);">ПРОФИЛЬ</b></header>
        <div style="background:var(--card); margin:15px; padding:20px; border-radius:25px;">
            <div onclick="app.openEdit('name')" style="margin-bottom:20px;">
                <div style="font-size:11px; color:var(--accent);">ИМЯ</div>
                <div id="p-name" style="font-size:18px;">...</div>
            </div>
            <div onclick="app.openEdit('nick')" style="margin-bottom:20px;">
                <div style="font-size:11px; color:var(--accent);">НИКНЕЙМ</div>
                <div id="p-nick" style="font-size:18px;">@...</div>
            </div>
            <div>
                <div style="font-size:11px; color:var(--accent);">ПОЧТА</div>
                <div id="p-email" style="font-size:16px; margin-bottom:10px;">••••••••••••</div>
                <button id="email-btn" onclick="app.toggleEmail()" style="background:none; border:1px solid var(--accent); color:var(--accent); padding:5px 12px; border-radius:10px; font-size:11px;">ПОКАЗАТЬ</button>
            </div>
        </div>
        <button onclick="app.logout()" style="color:var(--red); background:none; border:none; margin:10px 20px; font-weight:bold;">ВЫЙТИ</button>
    </div>

    <div id="del-menu" class="del-menu" onclick="this.style.display='none'">
        <button class="del-btn" onclick="app.copyMsg()">Копировать текст</button>
        <button class="del-btn" onclick="app.deleteMsg('me')">Удалить у меня</button>
        <button class="del-btn red" id="del-all-btn" onclick="app.deleteMsg('all')">Удалить у всех</button>
        <button class="del-btn" style="background:transparent; text-align:center;">Отмена</button>
    </div>

    <div id="search-modal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--accent); margin-bottom:15px;">Найти человека</h3>
            <div class="input-box"><input type="text" id="s-input" placeholder="Ник без @"></div>
            <button class="btn" onclick="app.findUser()">НАЙТИ И НАПИСАТЬ</button>
            <button class="btn" style="background:#222; color:#fff; margin-top:10px;" onclick="app.toggleModal('search-modal', false)">ОТМЕНА</button>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3 id="edit-title" style="color:var(--accent); margin-bottom:15px;">Изменить</h3>
            <div class="input-box"><input type="text" id="edit-input"></div>
            <button class="btn" id="edit-confirm-btn">СОХРАНИТЬ</button>
            <button class="btn" style="background:#222; color:#fff; margin-top:10px;" onclick="app.closeEdit()">ОТМЕНА</button>
        </div>
    </div>

    <div id="bottom-nav">
        <button class="nav-btn active" id="b-chats" onclick="app.tab('chats')"><i class="fas fa-comment"></i><span>ЧАТЫ</span></button>
        <button class="nav-btn" id="b-prof" onclick="app.tab('settings')"><i class="fas fa-user"></i><span>ПРОФИЛЬ</span></button>
    </div>

    <script>
        const app = {
            me: null, chats: JSON.parse(localStorage.getItem('f_chats') || "{}"), activeChat: null,
            msgToDel: null, msgTextToCopy: "",
            conf: { apiKey: "AIzaSyCrWLh9mCCZxeYH5sWFdCzwT3U2qgFGMEk", authDomain: "messenger-6d45a.firebaseapp.com", databaseURL: "https://messenger-6d45a-default-rtdb.firebaseio.com", projectId: "messenger-6d45a", storageBucket: "messenger-6d45a.firebasestorage.app", messagingSenderId: "871171819316", appId: "1:871171819316:web:bfa2459b42a1be9e780761" },

            showScreen(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                const nav = document.getElementById('bottom-nav');
                nav.className = (id === 'list-screen' || id === 'settings-screen') ? 'visible' : '';
            },

            viewPass(id) {
                const x = document.getElementById(id); x.type = x.type === "password" ? "text" : "password";
            },

            async auth(type) {
                try {
                    const e = document.getElementById(type === 'login' ? 'log-email' : 'reg-email').value;
                    const p1 = document.getElementById(type === 'login' ? 'log-pass' : 'reg-pass1').value;
                    if(type === 'reg' && p1 !== document.getElementById('reg-pass2').value) return alert("Пароли разные!");
                    if(type === 'login') await firebase.auth().signInWithEmailAndPassword(e, p1);
                    else await firebase.auth().createUserWithEmailAndPassword(e, p1);
                    location.reload();
                } catch(e) { alert(e.message); }
            },

            async init(user) {
                const uSnap = await firebase.database().ref('uids/' + user.uid).once('value');
                if(!uSnap.exists()) return;
                this.me = (await firebase.database().ref('users/' + uSnap.val().nick).once('value')).val();
                this.tab('chats');
                this.listenInbox();
            },

            listenInbox() {
                firebase.database().ref('inbox/' + this.me.nick).on('child_added', s => {
                    const d = s.val(); this.chats[d.from] = { name: d.fromName };
                    localStorage.setItem('f_chats', JSON.stringify(this.chats));
                    this.renderList();
                });
                this.renderList();
            },

            renderList() {
                const l = document.getElementById('chat-list'); l.innerHTML = '';
                Object.keys(this.chats).forEach(id => {
                    const d = document.createElement('div'); d.className = 'chat-item';
                    d.onclick = () => this.openChat(id, this.chats[id].name);
                    d.innerHTML = `<div class="avatar">${this.chats[id].name[0].toUpperCase()}</div>
                        <div><b>${this.chats[id].name}</b><br><small style="color:var(--gray)">@${id}</small></div>`;
                    l.appendChild(d);
                });
            },

            openChat(id, name) {
                this.activeChat = id;
                document.getElementById('chat-title').innerText = name;
                this.showScreen('chat-window');
                const b = document.getElementById('messages'); b.innerHTML = '';
                const chatId = [this.me.nick, id].sort().join('_');
                
                firebase.database().ref('chats/' + chatId).off();
                firebase.database().ref('chats/' + chatId).on('child_added', s => {
                    const m = s.val();
                    const d = document.createElement('div');
                    d.className = 'msg ' + (m.from === this.me.nick ? 'out' : 'in');
                    d.id = 'msg_' + s.key;
                    d.innerText = m.text;
                    
                    // Долгое нажатие (600мс)
                    let timer;
                    const start = (e) => {
                        timer = setTimeout(() => {
                            this.msgToDel = s.key;
                            this.msgTextToCopy = m.text;
                            this.showDelMenu(m.from);
                        }, 600);
                    };
                    const stop = () => clearTimeout(timer);

                    d.ontouchstart = start; d.ontouchend = stop;
                    d.onmousedown = start; d.onmouseup = stop;

                    b.appendChild(d); b.scrollTop = b.scrollHeight;
                });

                firebase.database().ref('chats/' + chatId).on('child_removed', s => {
                    const el = document.getElementById('msg_' + s.key);
                    if(el) el.remove();
                });
            },

            showDelMenu(from) {
                const menu = document.getElementById('del-menu');
                const btnAll = document.getElementById('del-all-btn');
                menu.style.display = 'flex';
                btnAll.style.display = (from === this.me.nick) ? 'block' : 'none';
            },

            copyMsg() {
                navigator.clipboard.writeText(this.msgTextToCopy).then(() => {
                    alert("Скопировано!");
                });
            },

            async deleteMsg(mode) {
                const chatId = [this.me.nick, this.activeChat].sort().join('_');
                if(mode === 'all') {
                    await firebase.database().ref('chats/' + chatId + '/' + this.msgToDel).remove();
                } else {
                    const el = document.getElementById('msg_' + this.msgToDel);
                    if(el) el.style.opacity = '0.3';
                }
            },

            async send() {
                const i = document.getElementById('m-input'), t = i.value.trim();
                if(!t || !this.activeChat) return;
                const chatId = [this.me.nick, this.activeChat].sort().join('_');
                const m = { from: this.me.nick, text: t, time: Date.now() };
                await firebase.database().ref('chats/' + chatId).push(m);
                await firebase.database().ref('inbox/' + this.activeChat + '/' + this.me.nick).set({ from: this.me.nick, fromName: this.me.name });
                i.value = '';
            },

            async findUser() {
                const n = document.getElementById('s-input').value.trim().toLowerCase();
                const s = await firebase.database().ref('users/' + n).once('value');
                if(!s.exists()) return alert("Не найден");
                this.toggleModal('search-modal', false);
                this.openChat(n, s.val().name);
            },

            tab(t) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                if(t === 'chats') { this.showScreen('list-screen'); document.getElementById('b-chats').classList.add('active'); }
                else { this.showScreen('settings-screen'); document.getElementById('b-prof').classList.add('active'); this.updateUI(); }
            },

            updateUI() {
                document.getElementById('p-name').innerText = this.me.name;
                document.getElementById('p-nick').innerText = '@' + this.me.nick;
            },

            toggleEmail() {
                const p = document.getElementById('p-email'), b = document.getElementById('email-btn');
                if(b.innerText === 'ПОКАЗАТЬ') { p.innerText = firebase.auth().currentUser.email; b.innerText = 'СКРЫТЬ'; }
                else { p.innerText = '••••••••••••'; b.innerText = 'ПОКАЗАТЬ'; }
            },

            toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; },
            
            openEdit(type) {
                const m = document.getElementById('edit-modal'), i = document.getElementById('edit-input'), t = document.getElementById('edit-title'), b = document.getElementById('edit-confirm-btn');
                m.style.display = 'flex';
                if(type === 'name') { t.innerText = "Имя"; i.value = this.me.name; b.onclick = () => this.saveEdit('name'); }
                else { t.innerText = "Никнейм"; i.value = this.me.nick; b.onclick = () => this.saveEdit('nick'); }
            },

            async saveEdit(type) {
                const v = document.getElementById('edit-input').value.trim();
                if(type === 'name') { await firebase.database().ref('users/' + this.me.nick).update({name: v}); this.me.name = v; }
                else { 
                    const n = v.toLowerCase().replace('@','');
                    await firebase.database().ref('users/' + n).set({...this.me, nick: n});
                    await firebase.database().ref('uids/' + firebase.auth().currentUser.uid).set({nick: n});
                    await firebase.database().ref('users/' + this.me.nick).remove();
                    this.me.nick = n;
                }
                this.updateUI(); this.closeEdit();
            },
            closeEdit() { document.getElementById('edit-modal').style.display = 'none'; },
            logout() { firebase.auth().signOut().then(() => { localStorage.clear(); location.reload(); }); }
        };

        window.onload = () => {
            firebase.initializeApp(app.conf);
            firebase.auth().onAuthStateChanged(u => u ? app.init(u) : app.showScreen('auth-screen'));
        };
    </script>
</body>
</html>

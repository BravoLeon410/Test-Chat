<style>
    /* Стили для новых модалок редактирования */
    .edit-modal { 
        position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
        z-index: 3000; display: none; align-items: center; justify-content: center; 
    }
    .edit-box { 
        background: var(--card); width: 85%; padding: 25px; 
        border-radius: 25px; border: 1px solid #333; text-align: center; 
    }
    .edit-box input { margin-bottom: 20px; text-align: center; border-color: var(--accent); }
</style>

<div id="edit-modal" class="edit-modal">
    <div class="edit-box">
        <h3 id="edit-title" style="color:var(--accent); margin-bottom:15px;">Редактировать</h3>
        <div class="input-box">
            <input type="text" id="edit-input" placeholder="...">
        </div>
        <button class="btn" id="edit-confirm-btn">СОХРАНИТЬ</button>
        <button class="btn" style="background:#222; color:#fff; margin-top:10px;" onclick="app.closeEdit()">ОТМЕНА</button>
    </div>
</div>

<script>
    const app = {
        me: null, 
        chats: JSON.parse(localStorage.getItem('f_chats') || "{}"),
        conf: { apiKey: "AIzaSyCrWLh9mCCZxeYH5sWFdCzwT3U2qgFGMEk", authDomain: "messenger-6d45a.firebaseapp.com", databaseURL: "https://messenger-6d45a-default-rtdb.firebaseio.com", projectId: "messenger-6d45a", storageBucket: "messenger-6d45a.firebasestorage.app", messagingSenderId: "871171819316", appId: "1:871171819316:web:bfa2459b42a1be9e780761" },

        // ТВОИ ФУНКЦИИ (ОСТАВИЛ БЕЗ ИЗМЕНЕНИЙ)
        showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            const nav = document.getElementById('bottom-nav');
            if(id === 'list-screen' || id === 'settings-screen') nav.classList.add('visible');
            else nav.classList.remove('visible');
        },
        viewPass(id) { const x = document.getElementById(id); x.type = x.type === "password" ? "text" : "password"; },
        tab(t) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(t === 'chats') { this.showScreen('list-screen'); document.getElementById('b-chats').classList.add('active'); }
            else { this.showScreen('settings-screen'); document.getElementById('b-prof').classList.add('active'); this.updateUI(); }
        },
        logout() { firebase.auth().signOut().then(() => { localStorage.clear(); location.reload(); }); },

        // НОВЫЙ ДИЗАЙН РЕДАКТИРОВАНИЯ
        openEdit(type) {
            const modal = document.getElementById('edit-modal');
            const input = document.getElementById('edit-input');
            const title = document.getElementById('edit-title');
            const btn = document.getElementById('edit-confirm-btn');

            modal.style.display = 'flex';
            if(type === 'name') {
                title.innerText = "Изменить имя";
                input.value = this.me.name;
                btn.onclick = () => this.saveEdit('name');
            } else {
                title.innerText = "Изменить ник";
                input.value = this.me.nick;
                btn.onclick = () => this.saveEdit('nick');
            }
        },

        closeEdit() { document.getElementById('edit-modal').style.display = 'none'; },

        async saveEdit(type) {
            const val = document.getElementById('edit-input').value.trim();
            if(!val) return;

            if(type === 'name') {
                await firebase.database().ref('users/' + this.me.nick).update({ name: val });
                this.me.name = val;
            } else {
                const newNick = val.toLowerCase().replace('@','');
                if(newNick === this.me.nick) return this.closeEdit();
                
                // Проверка занятости
                const check = await firebase.database().ref('users/' + newNick).once('value');
                if(check.exists()) return alert("Этот ник уже занят!");

                // Обновляем ник
                const oldNick = this.me.nick;
                await firebase.database().ref('users/' + newNick).set({ ...this.me, nick: newNick });
                await firebase.database().ref('uids/' + firebase.auth().currentUser.uid).set({ nick: newNick });
                await firebase.database().ref('users/' + oldNick).remove();
                
                this.me.nick = newNick;
                alert("Ник изменен! Старые чаты могут быть недоступны.");
            }
            this.updateUI();
            this.closeEdit();
        },

        // ПРИВЯЗКА К ТВОИМ КНОПКАМ
        editName() { this.openEdit('name'); },
        editNick() { this.openEdit('nick'); },

        // ОСТАЛЬНАЯ ЛОГИКА
        async init(user) {
            const uSnap = await firebase.database().ref('uids/' + user.uid).once('value');
            if(!uSnap.exists()) return this.showScreen('comp-screen');
            const myNick = uSnap.val().nick;
            const snap = await firebase.database().ref('users/' + myNick).once('value');
            this.me = snap.val();
            this.tab('chats');
            firebase.database().ref('inbox/' + myNick).on('child_added', s => {
                const d = s.val(); this.chats[d.from] = { name: d.fromName };
                localStorage.setItem('f_chats', JSON.stringify(this.chats));
                this.renderList();
            });
            this.renderList();
        },
        updateUI() {
            if(!this.me) return;
            document.getElementById('p-name').innerText = this.me.name;
            document.getElementById('p-nick').innerText = '@' + this.me.nick;
        },
        showEmail() { document.getElementById('p-email').innerText = firebase.auth().currentUser.email; },
        renderList() {
            const l = document.getElementById('chat-list'); l.innerHTML = '';
            for(let id in this.chats) {
                const d = document.createElement('div'); d.className = 'chat-item';
                d.innerHTML = `<div class="avatar">${this.chats[id].name[0].toUpperCase()}</div>
                    <div style="flex:1"><b>${this.chats[id].name}</b><br><small>@${id}</small></div>`;
                l.appendChild(d);
            }
        }
    };

    window.onload = () => {
        firebase.initializeApp(app.conf);
        firebase.auth().onAuthStateChanged(u => { if(u) app.init(u); else app.showScreen('auth-screen'); });
    };
</script>

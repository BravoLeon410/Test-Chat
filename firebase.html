<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вспышка</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; background-color: #1a1a1a; color: #eeeeee; }
        
        /* Экран входа */
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .auth-box { background: #2d2d2d; padding: 30px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); width: 320px; text-align: center; border: 1px solid #ff8c00; }
        
        /* Чат */
        #chat-screen { display: none; flex-direction: column; height: 100vh; }
        header { background-color: #ff8c00; color: #1a1a1a; padding: 15px; text-align: center; font-size: 1.4em; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #121212; }
        .message { background: #333; padding: 12px; border-radius: 10px; border-left: 4px solid #ff8c00; max-width: 85%; align-self: flex-start; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); }
        .message .author { font-weight: bold; font-size: 0.9em; color: #ff8c00; margin-bottom: 4px; }
        
        /* Поля ввода */
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; background: #222; color: #fff; outline: none; }
        input:focus { border-color: #ff8c00; }
        
        /* Кнопки */
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; text-transform: uppercase; }
        .btn-main { background-color: #ff8c00; color: #1a1a1a; }
        .btn-main:hover { background-color: #e67e00; transform: translateY(-1px); }
        .btn-reg { background-color: transparent; color: #ff8c00; border: 1px solid #ff8c00; margin-top: 10px; }
        .btn-reg:hover { background-color: rgba(255, 140, 0, 0.1); }
        
        /* Зона ввода сообщения */
        .input-area { display: flex; padding: 15px; background: #2d2d2d; border-top: 1px solid #444; }
        .input-area input { flex: 1; margin: 0 10px 0 0; border-color: #555; }
        .input-area button { width: auto; padding: 0 25px; }
        
        .logout-btn { background: none; color: #666; font-size: 11px; border: none; cursor: pointer; padding: 10px; text-decoration: underline; }
        .logout-btn:hover { color: #ff8c00; }

        /* Кастомизация скроллбара */
        #messages::-webkit-scrollbar { width: 5px; }
        #messages::-webkit-scrollbar-thumb { background: #ff8c00; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2 style="color: #ff8c00; margin-top: 0;">ВСПЫШКА</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <button class="btn-main" onclick="login()">Войти</button>
            <button class="btn-reg" onclick="register()">Регистрация</button>
        </div>
    </div>

    <div id="chat-screen">
        <header>Вспышка</header>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Введите сообщение...">
            <button class="btn-main" onclick="send()">ОТПРАВИТЬ</button>
        </div>
        <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrWLh9mCCZxeYH5sWFdCzwT3U2qgFGMEk",
            authDomain: "messenger-6d45a.firebaseapp.com",
            databaseURL: "https://messenger-6d45a-default-rtdb.firebaseio.com",
            projectId: "messenger-6d45a",
            storageBucket: "messenger-6d45a.firebasestorage.app",
            messagingSenderId: "871171819316",
            appId: "1:871171819316:web:bfa2459b42a1be9e780761"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        if (Notification.permission !== "granted") Notification.requestPermission();

        function register() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            if(!e || !p) return alert("Заполни поля!");
            auth.createUserWithEmailAndPassword(e, p)
                .then(() => alert("Регистрация успешна! Войдите."))
                .catch(err => alert(err.message));
        }

        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert("Ошибка: " + err.message));
        }

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                loadMessages();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('chat-screen').style.display = 'none';
                document.getElementById('messages').innerHTML = '';
            }
        });

        function send() {
            const input = document.getElementById('msg-input');
            const text = input.value;
            const user = auth.currentUser;
            if (text && user) {
                db.ref('messages').push({
                    u: user.email.split('@')[0],
                    t: text,
                    uid: user.uid
                });
                input.value = '';
            }
        }

        function loadMessages() {
            const box = document.getElementById('messages');
            db.ref('messages').off();
            db.ref('messages').limitToLast(50).on('child_added', snap => {
                const data = snap.val();
                const div = document.createElement('div');
                div.className = 'message';
                div.innerHTML = `<div class="author">${data.u}</div><div>${data.t}</div>`;
                box.appendChild(div);
                box.scrollTop = box.scrollHeight;

                if (data.uid !== auth.currentUser.uid && document.hidden) {
                    const n = new Notification("Вспышка", { body: `${data.u}: ${data.t}` });
                    n.onclick = () => { window.focus(); n.close(); };
                }
            });
        }
    </script>
</body>
</html>

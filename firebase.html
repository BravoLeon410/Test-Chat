<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Social Network</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #auth-container, #chat-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        input:focus { border-color: #0088cc; }
        button { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #0077b5; }
        .reg-btn { background: #28a745; }
        .reg-btn:hover { background: #218838; }
        .logout-btn { background: #dc3545; margin-top: 20px; }
        #messages { height: 300px; overflow-y: auto; border: 1px solid #eee; margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #fafafa; }
        .msg-item { margin-bottom: 8px; padding: 8px; border-radius: 5px; background: #fff; border-left: 4px solid #0088cc; font-size: 14px; }
        .msg-author { font-weight: bold; color: #555; display: block; font-size: 12px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="auth-container">
        <h2>Test Social Network</h2>
        <input type="email" id="email" placeholder="Электронная почта">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="handleLogin()">Войти</button>
        <button onclick="handleRegister()" class="reg-btn">Зарегистрироваться</button>
    </div>

    <div id="chat-container" class="hidden">
        <h2 id="welcome-user">Загрузка...</h2>
        <div id="messages"></div>
        <input type="text" id="message-input" placeholder="Напишите сообщение...">
        <button onclick="sendMessage()">Отправить</button>
        <button onclick="handleLogout()" class="logout-btn">Выйти</button>
    </div>

    <script>
        // Твой личный конфиг
        const firebaseConfig = {
            apiKey: "AIzaSyCrWLh9mCCZxeYH5sWFdCzwT3U2qgFGMEk",
            authDomain: "messenger-6d45a.firebaseapp.com",
            databaseURL: "https://messenger-6d45a-default-rtdb.firebaseio.com",
            projectId: "messenger-6d45a",
            storageBucket: "messenger-6d45a.firebasestorage.app",
            messagingSenderId: "871171819316",
            appId: "1:871171819316:web:bfa2459b42a1be9e780761"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Запрос уведомлений при старте
        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        // Логика регистрации
        function handleRegister() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert("Заполни все поля!");

            auth.createUserWithEmailAndPassword(email, password)
                .then(() => alert("Успех! Теперь войдите под своим паролем."))
                .catch(error => alert("Ошибка: " + error.message));
        }

        // Логика входа
        function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, password)
                .catch(error => alert("Ошибка входа: " + error.message));
        }

        // Выход
        function handleLogout() {
            auth.signOut();
        }

        // Слушатель состояния (В сети / Не в сети)
        auth.onAuthStateChanged(user => {
            const authCont = document.getElementById('auth-container');
            const chatCont = document.getElementById('chat-container');
            
            if (user) {
                authCont.classList.add('hidden');
                chatCont.classList.remove('hidden');
                document.getElementById('welcome-user').innerText = "Привет, " + user.email.split('@')[0];
                loadMessages();
            } else {
                authCont.classList.remove('hidden');
                chatCont.classList.add('hidden');
                document.getElementById('messages').innerHTML = ""; // очистка при выходе
            }
        });

        // Функция уведомления
        function showNotification(title, body) {
            if (Notification.permission === "granted" && document.hidden) {
                const notification = new Notification(title, { 
                    body: body,
                    icon: 'https://cdn-icons-png.flaticon.com/512/733/733577.png' 
                });
                notification.onclick = function() {
                    window.focus();
                    this.close();
                };
            }
        }

        // Отправка в Realtime Database
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value;
            const user = auth.currentUser;
            if (text && user) {
                db.ref('messages').push({
                    name: user.email.split('@')[0],
                    text: text,
                    uid: user.uid,
                    timestamp: Date.now()
                });
                input.value = '';
            }
        }

        // Загрузка сообщений в реальном времени
        function loadMessages() {
            const msgDiv = document.getElementById('messages');
            db.ref('messages').limitToLast(50).on('child_added', (snapshot) => {
                const msg = snapshot.val();
                const item = document.createElement('div');
                item.className = 'msg-item';
                item.innerHTML = `<span class="msg-author">${msg.name}</span>${msg.text}`;
                msgDiv.appendChild(item);
                msgDiv.scrollTop = msgDiv.scrollHeight;

                // Уведомление, если чат скрыт и сообщение чужое
                if (msg.uid !== auth.currentUser.uid) {
                    showNotification("Новое сообщение в Test Social Network", `${msg.name}: ${msg.text}`);
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вспышка</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121212;
            --accent-orange: #ff8c00;
            --text-white: #e0e0e0;
            --panel-bg: #1e1e1e;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: var(--bg-dark); 
            color: var(--text-white);
            overflow-x: hidden;
        }

        /* Шапка */
        .header {
            position: sticky; top: 0; background: var(--bg-dark);
            padding: 15px 20px; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; z-index: 100;
        }
        .header span { color: var(--accent-orange); font-weight: bold; font-size: 1.2rem; }

        /* Экраны */
        .screen { display: none; padding: 10px; min-height: 100vh; padding-bottom: 90px; }
        .screen.active { display: block; }

        /* Твой список чатов (ID сохранен для твоего кода) */
        #chats-list { display: flex; flex-direction: column; gap: 10px; }

        /* НИЖНЯЯ ПАНЕЛЬ (Закругленная и плавающая) */
        #bottom-nav {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 65px;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            display: flex; border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #444;
            z-index: 1000;
            touch-action: none;
        }

        .nav-item {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #777;
            cursor: pointer; transition: 0.2s;
        }

        .nav-item.active { color: var(--accent-orange); }
        .nav-item i { font-size: 22px; }
        .nav-item span { font-size: 10px; margin-top: 4px; text-transform: uppercase; }

        /* Профиль */
        .info-card { 
            background: var(--panel-bg); margin: 10px 0; padding: 15px; 
            border-radius: 15px; border-left: 4px solid var(--accent-orange);
        }
        .info-label { font-size: 11px; color: var(--accent-orange); text-transform: uppercase; }
        .info-value { font-size: 16px; margin-top: 5px; color: #fff; }

        button {
            background: var(--accent-orange); color: white; border: none;
            padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        
        /* Анимация "Печатает" */
        .typing-text { color: var(--accent-orange); font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="chats-screen" class="screen active">
        <div class="header">
            <span>ВСПЫШКА</span>
            <i class="fas fa-plus-circle" id="search-btn" style="color: var(--accent-orange); font-size: 1.5rem;"></i>
        </div>
        <div id="chats-list"></div>
    </div>

    <div id="settings-screen" class="screen">
        <div class="header"><span>НАСТРОЙКИ</span></div>
        
        <div style="text-align: center; padding: 20px;">
            <div style="position: relative; display: inline-block;">
                <img src="https://via.placeholder.com/100" id="user-avatar" 
                     style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent-orange); object-fit: cover;">
                <i class="fas fa-camera" style="position: absolute; bottom: 0; right: 0; background: var(--accent-orange); padding: 8px; border-radius: 50%; font-size: 12px;" onclick="document.getElementById('file-input').click()"></i>
            </div>
            <input type="file" id="file-input" style="display:none">
            <h2 id="profile-name" style="margin-top: 15px;">Загрузка...</h2>
        </div>

        <div class="info-card">
            <div class="info-label">Электронная почта</div>
            <div id="profile-email" class="info-value">...</div>
        </div>

        <div class="info-card">
            <div class="info-label">Никнейм</div>
            <div id="profile-nick" class="info-value">@...</div>
            <button style="margin-top: 10px; width: 100%;" onclick="changeNickname()">ИЗМЕНИТЬ НИК</button>
        </div>

        <button onclick="logout()" style="margin: 20px 0; width: 100%; background: transparent; border: 1px solid #ff4444; color: #ff4444;">ВЫЙТИ ИЗ АККАУНТА</button>
    </div>

    <div id="bottom-nav">
        <div class="nav-item active" id="tab-chats" onclick="switchTab('chats')">
            <i class="fas fa-comment-alt"></i>
            <span>Чаты</span>
        </div>
        <div class="nav-item" id="tab-settings" onclick="switchTab('settings')">
            <i class="fas fa-user-ninja"></i>
            <span>Профиль</span>
        </div>
    </div>

    <script>
        // ЛОГИКА СВАЙПА И НАВИГАЦИИ (Сохранена)
        let startX = 0;
        const navBar = document.getElementById('bottom-nav');

        function switchTab(tab) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if(tab === 'chats') {
                document.getElementById('chats-screen').classList.add('active');
                document.getElementById('tab-chats').classList.add('active');
            } else {
                document.getElementById('settings-screen').classList.add('active');
                document.getElementById('tab-settings').classList.add('active');
                if(typeof loadProfileInfo === "function") loadProfileInfo();
            }
        }

        navBar.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
        navBar.addEventListener('touchmove', (e) => {
            let moveX = e.touches[0].clientX;
            let diff = startX - moveX;
            if (diff > 60) switchTab('settings');
            if (diff < -60) switchTab('chats');
        });

        // Сюда вставь весь свой старый код Firebase (Init, Auth, Database)
        // Убедись, что функции отрисовки чатов используют ID 'chats-list'
    </script>
</body>
</html>

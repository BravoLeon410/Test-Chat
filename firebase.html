<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; --red: #ff4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }
        
        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        header { padding: 12px 15px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        
        /* Поля ввода */
        .input-group { position: relative; width: 100%; margin-bottom: 12px; }
        input { width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 14px 45px 14px 20px; border-radius: 30px; color: #fff; outline: none; font-size: 16px; }
        input:focus { border-color: var(--accent); }
        .toggle-pass { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--gray); cursor: pointer; font-size: 18px; }

        .btn { background: var(--accent); color: #000; border: none; padding: 14px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 16px; }
        
        /* Список чатов */
        .my-status { padding: 10px 20px; background: #080808; font-size: 13px; border-bottom: 1px solid #111; color: var(--gray); }
        .my-status b { color: var(--accent); }
        #chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 15px 20px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 15px; }
        .avatar { width: 50px; height: 50px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; flex-shrink: 0; }
        
        /* Сообщения */
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #050505; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 16px; line-height: 1.4; }
        .in { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }
        
        .input-bar { padding: 10px 15px 35px; background: var(--card); display: flex; gap: 10px; border-top: 1px solid #222; }
        .fab { position: fixed; bottom: 30px; right: 25px; width: 65px; height: 65px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; color: #000; z-index: 100; box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4); }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-box { background: var(--card); width: 85%; padding: 30px; border-radius: 25px; border: 1px solid #333; text-align: center; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen" style="display:flex; justify-content:center; align-items:center;">
        <div style="width:85%; text-align:center;">
            <h1 style="color:var(--accent); font-size:45px; margin-bottom:30px;">ВСПЫШКА</h1>
            <div class="input-group"><input type="email" id="log-email" placeholder="Email"></div>
            <div class="input-group">
                <input type="password" id="log-pass" placeholder="Пароль">
                <span class="toggle-pass" onclick="app.viewPass('log-pass')">👁️</span>
            </div>
            <button class="btn" onclick="app.auth('login')" style="width:100%; margin-top:10px;">ВОЙТИ</button>
            <button class="btn" onclick="app.toggleAuth(true)" style="width:100%; margin-top:10px; background:none; color:var(--accent); border:1px solid var(--accent);">РЕГИСТРАЦИЯ</button>
        </div>
    </div>

    <div id="reg-screen" class="screen" style="display:none; justify-content:center; align-items:center;">
        <div style="width:85%; text-align:center;">
            <h2 style="color:var(--accent); margin-bottom:25px;">Регистрация</h2>
            <div class="input-group"><input type="email" id="reg-email" placeholder="Email"></div>
            <div class="input-group">
                <input type="password" id="reg-pass1" placeholder="Пароль">
                <span class="toggle-pass" onclick="app.viewPass('reg-pass1')">👁️</span>
            </div>
            <div class="input-group">
                <input type="password" id="reg-pass2" placeholder="Повторите пароль">
                <span class="toggle-pass" onclick="app.viewPass('reg-pass2')">👁️</span>
            </div>
            <button class="btn" onclick="app.auth('reg')" style="width:100%;">СОЗДАТЬ</button>
            <div onclick="app.toggleAuth(false)" style="margin-top:20px; color:var(--gray);">Назад</div>
        </div>
    </div>

    <div id="comp-screen" class="screen" style="display:none; justify-content:center; align-items:center;">
        <div style="width:85%; text-align:center;">
            <h2 style="color:var(--accent); margin-bottom:20px;">Настройка профиля</h2>
            <div class="input-group"><input type="text" id="comp-nick" placeholder="@уникальный_ник"></div>
            <div class="input-group"><input type="text" id="comp-name" placeholder="Твое имя"></div>
            <button class="btn" onclick="app.completeProfile()" style="width:100%;">СОХРАНИТЬ</button>
        </div>
    </div>

    <div id="list-screen" class="screen">
        <header>
            <b style="color:var(--accent); font-size:20px;">ВСПЫШКА</b>
            <div onclick="app.logout()" style="color:var(--red); font-weight:bold;">ВЫХОД</div>
        </header>
        <div class="my-status">Вы: <span id="my-name-label">...</span> <b id="my-nick-label">@nick</b></div>
        <div id="chat-list"></div>
        <div class="fab" onclick="app.toggleModal('search-modal', true)">+</div>
    </div>

    <div id="search-modal" class="modal">
        <div class="modal-box">
            <h3 style="color:var(--accent); margin-bottom:20px;">Найти по нику</h3>
            <input type="text" id="search-input" placeholder="@ник..." style="margin-bottom:20px;">
            <button class="btn" onclick="app.findUser()" style="width:100%;">НАЙТИ</button>
            <button class="btn" onclick="app.toggleModal('search-modal', false)" style="width:100%; margin-top:10px; background:#222;">ОТМЕНА</button>
        </div>
    </div>

    <div id="chat-window" class="screen">
        <header>
            <div onclick="app.closeChat()" style="color:var(--accent); font-weight:bold;">‹ НАЗАД</div>
            <b id="chat-title">Чат</b>
            <div id="chat-avatar" class="avatar" style="width:35px; height:35px; font-size:14px;">?</div>
        </header>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-input" placeholder="Сообщение...">
            <button class="btn" onclick="app.send()">ОК</button>
        </div>
    </div>

    <script>
        const app = {
            me: null, currentNick: null, chats: JSON.parse(localStorage.getItem('f_chats') || "{}"),
            conf: {
                apiKey: "AIzaSyCrWLh9mCCZxeYH5sWFdCzwT3U2qgFGMEk",
                authDomain: "messenger-6d45a.firebaseapp.com",
                databaseURL: "https://messenger-6d45a-default-rtdb.firebaseio.com",
                projectId: "messenger-6d45a",
                storageBucket: "messenger-6d45a.firebasestorage.app",
                messagingSenderId: "871171819316",
                appId: "1:871171819316:web:bfa2459b42a1be9e780761"
            },

            viewPass(id) {
                const el = document.getElementById(id);
                el.type = el.type === 'password' ? 'text' : 'password';
            },

            toggleAuth(isReg) {
                document.getElementById('auth-screen').style.display = isReg ? 'none' : 'flex';
                document.getElementById('reg-screen').style.display = isReg ? 'flex' : 'none';
            },

            async auth(type) {
                if(type === 'reg') {
                    const e = document.getElementById('reg-email').value.trim();
                    const p1 = document.getElementById('reg-pass1').value;
                    const p2 = document.getElementById('reg-pass2').value;
                    if(p1 !== p2) return alert("Пароли не совпадают!");
                    if(p1.length < 6) return alert("Пароль слишком короткий!");
                    try { await firebase.auth().createUserWithEmailAndPassword(e, p1); location.reload(); }
                    catch(err) { alert(err.message); }
                } else {
                    const e = document.getElementById('log-email').value.trim();
                    const p = document.getElementById('log-pass').value;
                    try { await firebase.auth().signInWithEmailAndPassword(e, p); location.reload(); }
                    catch(err) { alert(err.message); }
                }
            },

            async completeProfile() {
                const ni = document.getElementById('comp-nick').value.trim().toLowerCase().replace('@','');
                const n = document.getElementById('comp-name').value.trim();
                const user = firebase.auth().currentUser;
                if(!ni || !n) return alert("Заполни поля!");
                const check = await firebase.database().ref('users/' + ni).once('value');
                if(check.exists()) return alert("Ник занят!");
                await firebase.database().ref('users/' + ni).set({ name: n, nick: ni, uid: user.uid });
                await firebase.database().ref('uids/' + user.uid).set({ nick: ni });
                location.reload();
            },

            async init(user) {
                const uSnap = await firebase.database().ref('uids/' + user.uid).once('value');
                if(!uSnap.exists()) {
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('comp-screen').style.display = 'flex';
                    return;
                }
                const myNick = uSnap.val().nick;
                const snap = await firebase.database().ref('users/' + myNick).once('value');
                this.me = snap.val();

                document.getElementById('my-name-label').innerText = this.me.name;
                document.getElementById('my-nick-label').innerText = '@' + myNick;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('list-screen').style.display = 'flex';

                // Слушаем входящие для списка чатов
                firebase.database().ref('inbox/' + myNick).on('child_added', s => {
                    const d = s.val();
                    this.chats[d.from] = { name: d.fromName };
                    this.save(); this.renderList();
                });
                this.renderList();
            },

            async findUser() {
                const t = document.getElementById('search-input').value.trim().toLowerCase().replace('@','');
                if(t === this.me.nick) return;
                const s = await firebase.database().ref('users/' + t).once('value');
                if(s.exists()) {
                    const u = s.val();
                    this.chats[t] = { name: u.name };
                    this.save(); this.toggleModal('search-modal', false);
                    this.openChat(t, u.name); this.renderList();
                } else alert("Никто не найден");
            },

            openChat(nick, name) {
                this.currentNick = nick;
                document.getElementById('chat-window').style.display = 'flex';
                document.getElementById('chat-title').innerText = name;
                document.getElementById('chat-avatar').innerText = name[0].toUpperCase();
                const box = document.getElementById('messages'); box.innerHTML = '';
                
                const id = [this.me.nick, nick].sort().join('_');
                firebase.database().ref('chats/'+id).off();
                firebase.database().ref('chats/'+id).on('child_added', s => {
                    const m = s.val(); this.renderMsg(m.f === this.me.nick, m.t);
                });
            },

            send() {
                const i = document.getElementById('m-input'), t = i.value.trim();
                if(!t || !this.currentNick) return;
                const id = [this.me.nick, this.currentNick].sort().join('_');
                firebase.database().ref('chats/'+id).push({ f: this.me.nick, t });
                firebase.database().ref('inbox/'+this.currentNick).push({ from: this.me.nick, fromName: this.me.name, text: t });
                i.value = '';
            },

            renderMsg(me, t) {
                const b = document.getElementById('messages'), d = document.createElement('div');
                d.className = `msg ${me ? 'out' : 'in'}`; d.innerText = t;
                b.appendChild(d); b.scrollTop = b.scrollHeight;
            },

            renderList() {
                const l = document.getElementById('chat-list'); l.innerHTML = '';
                for(let id in this.chats) {
                    const d = document.createElement('div'); d.className = 'chat-item';
                    d.innerHTML = `<div class="avatar">${this.chats[id].name[0].toUpperCase()}</div>
                        <div style="flex:1" onclick="app.openChat('${id}', '${this.chats[id].name}')">
                            <div style="font-weight:bold;">${this.chats[id].name}</div>
                            <div style="color:var(--gray); font-size:12px;">@${id}</div>
                        </div>`;
                    l.appendChild(d);
                }
            },

            toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; },
            closeChat() { this.currentNick = null; document.getElementById('chat-window').style.display = 'none'; },
            save() { localStorage.setItem('f_chats', JSON.stringify(this.chats)); },
            logout() { firebase.auth().signOut().then(() => { localStorage.clear(); location.reload(); }); }
        };

        window.onload = () => {
            firebase.initializeApp(app.conf);
            firebase.auth().onAuthStateChanged(u => { if(u) app.init(u); else document.getElementById('auth-screen').style.display = 'flex'; });
        };
    </script>
</body>
</html>

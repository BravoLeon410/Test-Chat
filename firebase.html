<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вспышка — Messenger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --panel-color: #1a1a1a;
            --accent-color: #ff8c00; /* Оранжевый */
            --text-main: #ffffff;
            --text-secondary: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            user-select: none;
            overflow-x: hidden;
        }

        /* Шапка */
        .header {
            position: sticky;
            top: 0;
            background: var(--bg-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 100;
        }
        .header h1 { color: var(--accent-color); margin: 0; font-size: 22px; letter-spacing: 1px; }

        /* Экраны */
        .screen { display: none; min-height: 100vh; padding-bottom: 100px; }
        .screen.active { display: block; }

        /* Список чатов (Оставил ID для твоего кода) */
        #chats-list { padding: 10px; }

        /* Нижняя панель — Кнопки с эффектом закругления */
        #bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            height: 70px;
            background: var(--panel-color);
            display: flex;
            border-radius: 35px;
            border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 1000;
            touch-action: none; /* Важно для свайпа */
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.1s ease;
            cursor: pointer;
            border-radius: 35px;
        }

        /* Эффект зажатия кнопки */
        .nav-item:active {
            background: rgba(255, 140, 0, 0.1);
            transform: scale(0.92);
        }

        .nav-item.active { color: var(--accent-color); }
        .nav-item i { font-size: 24px; }
        .nav-item span { font-size: 11px; margin-top: 4px; font-weight: bold; }

        /* Настройки и Профиль */
        .profile-container { padding: 20px; text-align: center; }
        .avatar-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }
        .avatar-box img {
            width: 100%; height: 100%; border-radius: 50%;
            border: 3px solid var(--accent-color); object-fit: cover;
        }
        
        .info-group {
            background: var(--panel-color);
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 15px;
            text-align: left;
            border-left: 5px solid var(--accent-color);
        }
        .label { color: var(--accent-color); font-size: 12px; text-transform: uppercase; margin-bottom: 5px; }
        .value { font-size: 17px; color: #fff; }

        .edit-btn {
            background: none; border: 1px solid var(--accent-color);
            color: var(--accent-color); padding: 5px 10px; border-radius: 5px;
            margin-top: 10px; cursor: pointer; font-size: 12px;
        }

        .logout-btn {
            margin-top: 30px; width: 100%; padding: 15px;
            background: #ff3333; color: white; border: none; border-radius: 10px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="chats-screen" class="screen active">
        <div class="header">
            <h1>ВСПЫШКА</h1>
            <i class="fas fa-search-plus" id="add-chat-btn" style="color: var(--accent-color); font-size: 22px;"></i>
        </div>
        <div id="chats-list">
            </div>
    </div>

    <div id="settings-screen" class="screen">
        <div class="header"><h1>ПРОФИЛЬ</h1></div>
        
        <div class="profile-container">
            <div class="avatar-box">
                <img src="default-avatar.png" id="user-avatar-img">
                <div style="position: absolute; bottom: 0; right: 0; background: var(--accent-color); padding: 7px; border-radius: 50%; font-size: 12px;" onclick="changeAvatar()">
                    <i class="fas fa-camera"></i>
                </div>
            </div>

            <div class="info-group">
                <div class="label">Твоя почта</div>
                <div id="profile-email" class="value">Загрузка...</div>
            </div>

            <div class="info-group">
                <div class="label">Имя (отображаемое)</div>
                <div id="profile-name" class="value">...</div>
                <button class="edit-btn" onclick="editDisplayName()">ИЗМЕНИТЬ ИМЯ</button>
            </div>

            <div class="info-group">
                <div class="label">Никнейм (@username)</div>
                <div id="profile-nickname" class="value">@...</div>
                <button class="edit-btn" onclick="editUserNickname()">ИЗМЕНИТЬ НИК</button>
            </div>

            <button class="logout-btn" onclick="firebaseLogout()">ВЫЙТИ ИЗ СИСТЕМЫ</button>
        </div>
    </div>

    <div id="bottom-nav">
        <div class="nav-item active" id="btn-chats" onclick="showTab('chats')">
            <i class="fas fa-comments"></i>
            <span>ЧАТЫ</span>
        </div>
        <div class="nav-item" id="btn-settings" onclick="showTab('settings')">
            <i class="fas fa-user-circle"></i>
            <span>ПРОФИЛЬ</span>
        </div>
    </div>

    <script>
        // Логика переключения и "перетаскивания" пальцем
        let startX = 0;
        const nav = document.getElementById('bottom-nav');

        function showTab(tabName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

            if(tabName === 'chats') {
                document.getElementById('chats-screen').classList.add('active');
                document.getElementById('btn-chats').classList.add('active');
            } else {
                document.getElementById('settings-screen').classList.add('active');
                document.getElementById('btn-settings').classList.add('active');
                // Вызываем функцию обновления данных профиля, если она есть
                if (typeof syncProfileData === 'function') syncProfileData();
            }
        }

        // Обработка жеста (зажимаем на панели и ведем)
        nav.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });

        nav.addEventListener('touchmove', (e) => {
            let currentX = e.touches[0].clientX;
            let diff = startX - currentX;

            if (diff > 50) showTab('settings'); // Свайп влево
            if (diff < -50) showTab('chats');    // Свайп вправо
        });

        // ПРИМЕЧАНИЕ ДЛЯ ТЕБЯ:
        // Теперь вставь сюда свой старый код Firebase. 
        // 1. Используй document.getElementById('profile-email').innerText = user.email; для почты.
        // 2. Функции для смены имени и ника раздели — одну пиши в базу как 'name', другую как 'nickname'.
    </script>
</body>
</html>

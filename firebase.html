<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вспышка — Мессенджер</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0088cc;
            --bg-color: #ffffff;
            --nav-bg: #f4f4f4;
            --text-color: #333;
        }

        body { font-family: sans-serif; margin: 0; padding-bottom: 60px; background: var(--bg-color); }

        /* Экраны */
        .screen { display: none; height: 100vh; overflow-y: auto; }
        .screen.active { display: block; }

        /* Шапка с плюсиком */
        .header {
            position: sticky; top: 0; background: var(--primary-color);
            color: white; padding: 15px; display: flex;
            justify-content: space-between; align-items: center; z-index: 10;
        }

        /* Нижняя панель */
        #bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 60px;
            background: var(--nav-bg); display: flex; border-top: 1px solid #ddd;
            touch-action: none; /* Для корректного отслеживания жестов */
        }

        .nav-item {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #888;
            cursor: pointer; transition: 0.3s;
        }

        .nav-item.active { color: var(--primary-color); }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 12px; margin-top: 4px; }

        /* Профиль и Настройки */
        .profile-section { padding: 20px; text-align: center; }
        .avatar-main {
            width: 100px; height: 100px; border-radius: 50%;
            background: #ddd; object-fit: cover; cursor: pointer;
        }
        .info-card { background: #f9f9f9; margin: 15px; padding: 15px; border-radius: 10px; text-align: left; }
        .info-label { font-size: 12px; color: #888; }
        .info-value { font-size: 16px; margin-bottom: 10px; font-weight: bold; }

        /* Анимация точек печатания */
        .typing-indicator { font-style: italic; font-size: 13px; color: #555; height: 15px; }
        .dots::after {
            content: ''; animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; }
        }

        /* Список чатов */
        .chat-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
    </style>
</head>
<body>

    <div id="chats-screen" class="screen active">
        <div class="header">
            <span>Вспышка</span>
            <i class="fas fa-plus" onclick="openSearch()" style="cursor:pointer"></i>
        </div>
        <div id="chats-list">
            </div>
    </div>

    <div id="settings-screen" class="screen">
        <div class="header"><span>Настройки</span></div>
        <div class="profile-section">
            <img src="https://via.placeholder.com/100" id="user-avatar" class="avatar-main" onclick="triggerUpload()">
            <input type="file" id="file-input" style="display:none" onchange="uploadPhoto()">
            <h3 id="profile-name">Загрузка...</h3>
        </div>
        
        <div class="info-card">
            <div class="info-label">Почта</div>
            <div id="profile-email" class="info-value">...</div>
            
            <div class="info-label">Никнейм</div>
            <div id="profile-nick" class="info-value">@...</div>
            <button onclick="changeNickname()">Изменить ник</button>
        </div>

        <div style="padding: 15px;">
            <button onclick="logout()" style="color: red; background: none; border: 1px solid red; width: 100%; padding: 10px; border-radius: 5px;">Выйти</button>
        </div>
    </div>

    <div id="bottom-nav">
        <div class="nav-item active" id="tab-chats" onclick="switchTab('chats')">
            <i class="fas fa-comment-dots"></i>
            <span>Чаты</span>
        </div>
        <div class="nav-item" id="tab-settings" onclick="switchTab('settings')">
            <i class="fas fa-user-cog"></i>
            <span>Настройки</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-auth.js"></script>

    <script>
        // --- ЛОГИКА НАВИГАЦИИ И СВАЙПОВ ---
        let startX = 0;
        const navBar = document.getElementById('bottom-nav');

        // Переключение вкладок
        function switchTab(tab) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if(tab === 'chats') {
                document.getElementById('chats-screen').classList.add('active');
                document.getElementById('tab-chats').classList.add('active');
            } else {
                document.getElementById('settings-screen').classList.add('active');
                document.getElementById('tab-settings').classList.add('active');
                loadProfileInfo(); // Подгружаем данные профиля
            }
        }

        // Обработка передвижения пальцем по нижней панели
        navBar.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });

        navBar.addEventListener('touchmove', (e) => {
            let moveX = e.touches[0].clientX;
            let diff = startX - moveX;

            if (diff > 50) switchTab('settings'); // Свайп влево -> Настройки
            if (diff < -50) switchTab('chats');    // Свайп вправо -> Чаты
        });

        // --- ФУНКЦИИ ПРОФИЛЯ ---
        function loadProfileInfo() {
            const user = firebase.auth().currentUser;
            if (user) {
                document.getElementById('profile-email').innerText = user.email;

                db.ref('users/' + user.uid).once('value').then(snap => {
                    const data = snap.val();
                    document.getElementById('profile-name').innerText = data.name || "Без имени";
                    document.getElementById('profile-nick').innerText = "@" + (data.nickname || "id" + user.uid);
                });
            }
        }

        function changeNickname() {
            const newNick = prompt("Введите новый никнейм:");

        // --- СТАТУС ПЕЧАТАНИЯ (TYPING) ---

</body>
</html>

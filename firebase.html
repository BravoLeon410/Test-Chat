<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; --red: #ff4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }
        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        .screen.active { display: flex; }
        header { padding: 15px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .input-box { position: relative; width: 100%; margin-bottom: 12px; }
        input { width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 15px 50px 15px 20px; border-radius: 30px; color: #fff; outline: none; font-size: 16px; }
        .btn { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 30px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
        .fab { position: fixed; bottom: 100px; right: 25px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #000; z-index: 100; border: none; }
        .chat-item { padding: 15px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .avatar { width: 50px; height: 50px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 16px; line-height: 1.4; position: relative; user-select: none; -webkit-user-select: none; cursor: pointer; }
        .msg.out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }
        .msg.in { align-self: flex-start; background: #222; color: #fff; border-bottom-left-radius: 4px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card); width: 100%; max-width: 400px; padding: 25px; border-radius: 25px; border: 1px solid #333; text-align: center; }
        #bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 70px; background: #111; display: none; border-radius: 35px; border: 1px solid #333; z-index: 1000; }
        #bottom-nav.visible { display: flex; }
        .nav-btn { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--gray); }
        .nav-btn.active { color: var(--accent); }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen" style="justify-content:center; padding:30px;">
        <h1 style="color:var(--accent); text-align:center; margin-bottom:40px;">ВСПЫШКА</h1>
        <div class="input-box"><input type="email" id="log-email" placeholder="Email"></div>
        <div class="input-box"><input type="password" id="log-pass" placeholder="Пароль"></div>
        <button class="btn" onclick="app.auth('login')">ВОЙТИ</button>
        <p onclick="app.showScreen('reg-screen')" style="text-align:center; margin-top:20px; color:var(--gray);">Создать аккаунт</p>
    </div>

    <div id="reg-screen" class="screen" style="justify-content:center; padding:30px;">
        <h2 style="color:var(--accent); text-align:center; margin-bottom:30px;">РЕГИСТРАЦИЯ</h2>
        <div class="input-box"><input type="email" id="reg-email" placeholder="Email"></div>
        <div class="input-box"><input type="text" id="reg-name" placeholder="Ваше Имя"></div>
        <div class="input-box"><input type="text" id="reg-nick" placeholder="Никнейм"></div>
        <div class="input-box"><input type="password" id="reg-pass1" placeholder="Пароль"></div>
        <button class="btn" onclick="app.auth('reg')">СОЗДАТЬ</button>
        <p onclick="app.showScreen('auth-screen')" style="text-align:center; margin-top:20px; color:var(--gray);">Назад</p>
    </div>

    <div id="list-screen" class="screen">
        <header><b style="color:var(--accent); font-size:22px;">ЧАТЫ</b></header>
        <div id="chat-list" style="flex:1; overflow-y:auto;"></div>
        <button class="fab" onclick="app.toggleModal('search-modal', true)"><i class="fas fa-plus"></i></button>
    </div>

    <div id="chat-window" class="screen">
        <header><i class="fas fa-arrow-left" onclick="app.tab('chats')"></i><b id="chat-title">Чат</b><div style="width:20px;"></div></header>
        <div id="messages"></div>
        <div style="padding:15px; display:flex; gap:10px; background:var(--card);">
            <input type="text" id="m-input" placeholder="Сообщение..." style="margin-bottom:0;">
            <button onclick="app.send()" style="background:var(--accent); border:none; width:50px; border-radius:50%; color:#000;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="settings-screen" class="screen">
        <header><b style="color:var(--accent);">ПРОФИЛЬ</b></header>
        <div style="background:var(--card); margin:15px; padding:20px; border-radius:25px;">
            <div onclick="app.openEdit('name')" style="margin-bottom:20px;">
                <div style="font-size:11px; color:var(--accent);">ИМЯ</div>
                <div id="p-name" style="font-size:18px;">Загрузка...</div>
            </div>
            <div onclick="app.openEdit('nick')" style="margin-bottom:20px;">
                <div style="font-size:11px; color:var(--accent);">НИКНЕЙМ</div>
                <div id="p-nick" style="font-size:18px;">@...</div>
            </div>
            <div>
                <div style="font-size:11px; color:var(--accent);">ПОЧТА</div>
                <div id="p-email" style="font-size:16px; margin-bottom:10px;">••••••••••••</div>
                <button id="email-btn" onclick="app.toggleEmail()" style="background:none; border:1px solid var(--accent); color:var(--accent); padding:5px 12px; border-radius:10px; font-size:11px;">ПОКАЗАТЬ</button>
            </div>
        </div>
        <button onclick="app.logout()" style="color:var(--red); background:none; border:none; margin:10px 20px; font-weight:bold;">ВЫЙТИ</button>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3 id="edit-title" style="color:var(--accent); margin-bottom:15px;">Изменить</h3>
            <div class="input-box"><input type="text" id="edit-input"></div>
            <button class="btn" id="edit-confirm-btn">СОХРАНИТЬ</button>
            <button class="btn" style="background:#222; color:#fff; margin-top:10px;" onclick="app.closeEdit()">ОТМЕНА</button>
        </div>
    </div>

    <div id="bottom-nav">
        <button class="nav-btn active" id="b-chats" onclick="app.tab('chats')"><i class="fas fa-comment"></i><span>ЧАТЫ</span></button>
        <button class="nav-btn" id="b-prof" onclick="app.tab('settings')"><i class="fas fa-user"></i><span>ПРОФИЛЬ</span></button>
    </div>

    <script>
        const app = {
            me: null, chats: JSON.parse(localStorage.getItem('f_chats') || "{}"), activeChat: null,
            conf: { apiKey: "AIzaSyCrWLh9mCCZxeYH5sWFdCzwT3U2qgFGMEk", authDomain: "messenger-6d45a.firebaseapp.com", databaseURL: "https://messenger-6d45a-default-rtdb.firebaseio.com", projectId: "messenger-6d45a", storageBucket: "messenger-6d45a.firebasestorage.app", messagingSenderId: "871171819316", appId: "1:871171819316:web:bfa2459b42a1be9e780761" },

            showScreen(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                document.getElementById('bottom-nav').className = (id === 'list-screen' || id === 'settings-screen') ? 'visible' : '';
            },

            async auth(type) {
                try {
                    const e = document.getElementById(type === 'login' ? 'log-email' : 'reg-email').value;
                    const p = document.getElementById(type === 'login' ? 'log-pass' : 'reg-pass1').value;
                    if(type === 'reg') {
                        const name = document.getElementById('reg-name').value;
                        const nick = document.getElementById('reg-nick').value.toLowerCase().trim();
                        const res = await firebase.auth().createUserWithEmailAndPassword(e, p);
                        await firebase.database().ref('users/' + nick).set({ name, nick, uid: res.user.uid, email: e });
                        await firebase.database().ref('uids/' + res.user.uid).set({ nick });
                    } else {
                        await firebase.auth().signInWithEmailAndPassword(e, p);
                    }
                    location.reload();
                } catch(e) { alert(e.message); }
            },

            async init(user) {
                const uSnap = await firebase.database().ref('uids/' + user.uid).once('value');
                if(!uSnap.exists()) return this.showScreen('auth-screen');
                const snap = await firebase.database().ref('users/' + uSnap.val().nick).once('value');
                this.me = snap.val();
                this.updateUI();
                this.tab('chats');
            },

            updateUI() {
                if(!this.me) return;
                document.getElementById('p-name').innerText = this.me.name || "Без имени";
                document.getElementById('p-nick').innerText = '@' + (this.me.nick || "...");
            },

            tab(t) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                if(t === 'chats') { this.showScreen('list-screen'); document.getElementById('b-chats').classList.add('active'); }
                else { this.showScreen('settings-screen'); document.getElementById('b-prof').classList.add('active'); this.updateUI(); }
            },

            openEdit(type) {
                const i = document.getElementById('edit-input'), t = document.getElementById('edit-title'), b = document.getElementById('edit-confirm-btn');
                document.getElementById('edit-modal').style.display = 'flex';
                if(type === 'name') { t.innerText = "Имя"; i.value = this.me.name; b.onclick = () => this.saveEdit('name'); }
                else { t.innerText = "Никнейм"; i.value = this.me.nick; b.onclick = () => this.saveEdit('nick'); }
            },

            async saveEdit(type) {
                const v = document.getElementById('edit-input').value.trim();
                if(!v) return;
                const oldNick = this.me.nick;
                if(type === 'name') {
                    await firebase.database().ref('users/' + oldNick).update({ name: v });
                    this.me.name = v;
                } else {
                    const newNick = v.toLowerCase();
                    if(newNick === oldNick) return this.closeEdit();
                    const check = await firebase.database().ref('users/' + newNick).once('value');
                    if(check.exists()) return alert("Ник занят!");
                    
                    // Переносим всё в новый узел
                    const newData = { ...this.me, nick: newNick };
                    await firebase.database().ref('users/' + newNick).set(newData);
                    await firebase.database().ref('uids/' + firebase.auth().currentUser.uid).set({ nick: newNick });
                    await firebase.database().ref('users/' + oldNick).remove();
                    this.me = newData;
                }
                this.updateUI();
                this.closeEdit();
            },

            closeEdit() { document.getElementById('edit-modal').style.display = 'none'; },
            toggleEmail() {
                const p = document.getElementById('p-email'), b = document.getElementById('email-btn');
                if(b.innerText === 'ПОКАЗАТЬ') { p.innerText = firebase.auth().currentUser.email; b.innerText = 'СКРЫТЬ'; }
                else { p.innerText = '••••••••••••'; b.innerText = 'ПОКАЗАТЬ'; }
            },
            logout() { firebase.auth().signOut().then(() => location.reload()); }
        };

        window.onload = () => {
            firebase.initializeApp(app.conf);
            firebase.auth().onAuthStateChanged(u => u ? app.init(u) : app.showScreen('auth-screen'));
        };
    </script>
</body>
</html>

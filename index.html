<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; user-select: none; }
        
        input, .msg { user-select: text; -webkit-user-select: text; }

        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        #auth-screen { display: flex; justify-content: center; align-items: center; z-index: 1000; }
        
        header { padding: 15px 20px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        
        .logout-btn { color: #ff4444; border: 1px solid #ff4444; padding: 6px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }

        /* УВЕДОМЛЕНИЕ */
        #push-notif { 
            position: fixed; top: -120px; left: 10px; right: 10px; 
            background: #1e1e1e; color: #fff; border-left: 4px solid var(--accent);
            padding: 15px; border-radius: 12px; z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: top 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28); 
            display: flex; align-items: center; gap: 12px; cursor: pointer;
        }
        #push-notif.show { top: 20px; }

        /* АНИМАЦИЯ ПЕЧАТИ */
        .typing-dots { display: none; font-size: 0.8rem; color: var(--accent); margin-left: 5px; }
        .typing-dots span { animation: blink 1s infinite; margin: 0 1px; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

        .chat-item { padding: 15px 20px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 15px; }
        .avatar { width: 48px; height: 48px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; flex-shrink: 0; }
        
        .fab { position: fixed; bottom: 30px; right: 25px; width: 65px; height: 65px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; color: #000; z-index: 100; }

        #chat-window { z-index: 1500; }
        .chat-header { padding: 12px 15px; background: var(--card); display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #222; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #050505; }
        
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 16px; }
        .in { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }

        .input-bar { padding: 10px 15px 40px 15px; background: var(--card); display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 12px 20px; border-radius: 30px; color: #fff; outline: none; }
        .btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="push-notif" onclick="app.handlePushClick()">
        <div id="push-avatar" class="avatar" style="width:35px; height:35px; font-size:0.8rem;">?</div>
        <div style="flex:1; overflow:hidden;">
            <div id="push-name" style="color:var(--accent); font-weight:bold; font-size:0.9rem;"></div>
            <div id="push-msg" style="font-size:0.85rem; opacity:0.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
        </div>
    </div>

    <div id="auth-screen" class="screen">
        <div style="text-align: center; width: 85%;">
            <h1 style="color:var(--accent); font-size: 2.8rem; margin-bottom: 40px;">ВСПЫШКА</h1>
            <input type="text" id="reg-name" placeholder="Ваше имя" style="width:100%; margin-bottom:12px;">
            <input type="text" id="reg-nick" placeholder="Никнейм (@nick)" style="width:100%; margin-bottom:20px;">
            <button class="btn" id="login-btn" onclick="app.loginAction()" style="width:100%; height: 55px;">ВОЙТИ</button>
        </div>
    </div>

    <div id="list-screen" class="screen">
        <header><b style="color:var(--accent); font-size: 1.2rem;">ВСПЫШКА</b><div class="logout-btn" onclick="app.logout()">ВЫЙТИ</div></header>
        <div id="chat-items-container" style="flex: 1; overflow-y: auto;"></div>
        <div class="fab" onclick="app.showSearch()">+</div>
    </div>

    <div id="chat-window" class="screen">
        <div class="chat-header">
            <div onclick="app.closeChat()" style="font-size:2.5rem; color:var(--accent); padding: 0 10px; cursor: pointer;">‹</div>
            <div id="c-avatar" class="avatar" style="width:40px; height:40px;">?</div>
            <div style="flex:1; margin-left: 5px;">
                <div id="c-name" style="font-weight:bold;">Имя</div>
                <div id="c-typing" class="typing-dots">печатает<span>.</span><span>.</span><span>.</span></div>
            </div>
        </div>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-input" placeholder="Сообщение..." oninput="app.sendTyping()">
            <button class="btn" onclick="app.send()">ОК</button>
        </div>
    </div>

    <script>
        const app = {
            key: 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig',
            ably: null,
            me: { nick: '', name: '' },
            currentNick: '',
            pushTarget: '',
            chats: JSON.parse(localStorage.getItem('v15_chats') || "{}"),
            history: JSON.parse(localStorage.getItem('v15_hist') || "{}"),

            loginAction() {
                const name = document.getElementById('reg-name').value.trim();
                const nick = document.getElementById('reg-nick').value.trim().toLowerCase().replace('@','');
                if(!name || !nick) return alert("Заполни поля!");
                this.login(name, nick);
            },

            login(name, nick) {
                this.me = { name, nick };
                localStorage.setItem('v15_me_n', name); localStorage.setItem('v15_me_u', nick);
                this.ably = new Ably.Realtime({ key: this.key, clientId: nick });
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('list-screen').style.display = 'flex';
                this.initLogic();
                this.renderList();
            },

            initLogic() {
                const chan = this.ably.channels.get('v15-main');
                // Слушаем личные сообщения и статус печати
                this.ably.channels.get('v15-user-' + this.me.nick).subscribe((m) => {
                    if(m.name === 'msg') {
                        const { from, name, text } = m.data;
                        if(!this.chats[from]) this.chats[from] = { name };
                        if(!this.history[from]) this.history[from] = [];
                        this.history[from].push({ f: from, t: text });
                        this.save();
                        if(this.currentNick === from) this.renderMsg(false, text);
                        else this.triggerPush(from, name, text);
                        this.renderList();
                    }
                    if(m.name === 'typing') {
                        if(this.currentNick === m.data.from) {
                            const t = document.getElementById('c-typing');
                            t.style.display = 'block';
                            clearTimeout(this.typeTimer);
                            this.typeTimer = setTimeout(() => t.style.display = 'none', 2000);
                        }
                    }
                });
            },

            sendTyping() {
                if(!this.currentNick) return;
                this.ably.channels.get('v15-user-' + this.currentNick).publish('typing', { from: this.me.nick });
            },

            triggerPush(from, name, text) {
                this.pushTarget = from;
                const p = document.getElementById('push-notif');
                document.getElementById('push-name').innerText = name;
                document.getElementById('push-avatar').innerText = name[0];
                document.getElementById('push-msg').innerText = text;
                p.classList.add('show');
                setTimeout(() => p.classList.remove('show'), 4000);
            },

            handlePushClick() {
                if(this.pushTarget) {
                    this.openChat(this.pushTarget, this.chats[this.pushTarget].name);
                    document.getElementById('push-notif').classList.remove('show');
                }
            },

            openChat(nick, name) {
                this.currentNick = nick;
                document.getElementById('chat-window').style.display = 'flex';
                document.getElementById('c-name').innerText = name;
                document.getElementById('c-avatar').innerText = name[0];
                const box = document.getElementById('messages'); box.innerHTML = '';
                if(this.history[nick]) this.history[nick].forEach(m => this.renderMsg(m.f === this.me.nick, m.t));
            },

            send() {
                const i = document.getElementById('m-input');
                const text = i.value.trim();
                if(!text || !this.currentNick) return;
                if(!this.history[this.currentNick]) this.history[this.currentNick] = [];
                this.history[this.currentNick].push({ f: this.me.nick, t: text });
                this.save();
                this.ably.channels.get('v15-user-' + this.currentNick).publish('msg', { from: this.me.nick, name: this.me.name, text });
                this.renderMsg(true, text);
                this.renderList();
                i.value = '';
            },

            renderMsg(me, t) {
                const b = document.getElementById('messages');
                const d = document.createElement('div');
                d.className = `msg ${me ? 'out' : 'in'}`; d.innerText = t;
                b.appendChild(d); b.scrollTop = b.scrollHeight;
            },

            renderList() {
                const c = document.getElementById('chat-items-container'); c.innerHTML = '';
                for(let n in this.chats) {
                    const d = document.createElement('div'); d.className = 'chat-item';
                    d.onclick = () => this.openChat(n, this.chats[n].name);
                    d.innerHTML = `<div class="avatar">${this.chats[n].name[0]}</div>
                        <div style="flex:1"><b>${this.chats[n].name}</b><div style="font-size:0.8rem; color:var(--accent)">@${n}</div></div>`;
                    c.appendChild(d);
                }
            },

            showSearch() {
                const t = prompt("Введите @ник:");
                if(t) {
                    const nick = t.toLowerCase().replace('@','');
                    const name = prompt("Имя собеседника:");
                    if(nick && name) { this.chats[nick] = { name }; this.save(); this.openChat(nick, name); this.renderList(); }
                }
            },

            closeChat() { this.currentNick = ''; document.getElementById('chat-window').style.display = 'none'; },
            save() { localStorage.setItem('v15_chats', JSON.stringify(this.chats)); localStorage.setItem('v15_hist', JSON.stringify(this.history)); },
            logout() { 
                // Удаляем только данные текущего входа, но оставляем историю чатов
                localStorage.removeItem('v15_me_n'); localStorage.removeItem('v15_me_u');
                location.reload(); 
            }
        };

        window.onload = () => {
            const n = localStorage.getItem('v15_me_n'), u = localStorage.getItem('v15_me_u');
            if(n && u) app.login(n, u);
            else document.getElementById('auth-screen').style.display = 'flex';
        };
    </script>
</body>
</html>

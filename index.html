<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card: #111111;
            --accent: #ff8c00;
            --text: #ffffff;
            --gray: #888888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; position: relative; }

        /* Экран регистрации */
        #auth-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; justify-content: center; align-items: center; z-index: 3000;
        }
        .auth-box { text-align: center; width: 85%; max-width: 320px; }
        .auth-box h1 { color: var(--accent); letter-spacing: 5px; margin-bottom: 25px; }

        /* Список чатов */
        #chat-list-screen { display: flex; flex-direction: column; height: 100%; width: 100%; }
        header { padding: 20px; background: var(--card); border-bottom: 1px solid #222; display: flex; flex-direction: column; gap: 5px; }
        
        .chat-item {
            padding: 15px 20px; border-bottom: 1px solid #111;
            display: flex; align-items: center; gap: 15px;
        }
        .avatar { width: 50px; height: 50px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 1.2rem; }

        /* Плавающая кнопка Плюс */
        .fab {
            position: absolute; bottom: 40px; right: 30px;
            width: 65px; height: 65px; background: var(--accent);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 35px; color: #000; box-shadow: 0 8px 20px rgba(255,140,0,0.4);
            cursor: pointer; z-index: 100; transition: 0.2s;
        }
        .fab:active { transform: scale(0.9); }

        /* Окно чата (скрыто по умолчанию) */
        #chat-window { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 200; }
        .chat-header { padding: 15px; background: var(--card); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #222; }
        
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 20px; word-wrap: break-word; line-height: 1.4; }
        .in { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; font-weight: 500; }

        .input-bar {
            padding: 15px 15px 45px 15px; background: var(--card);
            display: flex; gap: 10px; border-top: 1px solid #222;
        }

        input { flex: 1; background: #1e1e1e; border: 1px solid #333; padding: 14px 20px; border-radius: 30px; color: #fff; outline: none; font-size: 16px; }
        button { background: var(--accent); color: #000; border: none; padding: 0 25px; border-radius: 30px; font-weight: bold; }

        .back-btn { font-size: 1.8rem; cursor: pointer; color: var(--accent); padding-right: 5px; }
        
        #empty-hint { text-align: center; margin-top: 100px; color: #444; padding: 20px; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h1>ВСПЫШКА</h1>
            <input type="text" id="my-name" placeholder="Ваше Имя (видно всем)" style="width: 100%; margin-bottom: 15px;">
            <input type="text" id="my-nick" placeholder="Никнейм (для поиска)" style="width: 100%; margin-bottom: 20px;">
            <button onclick="login()" style="width: 100%; height: 50px;">ВОЙТИ</button>
        </div>
    </div>

    <div id="chat-list-screen">
        <header>
            <span style="font-weight: 900; color: var(--accent); font-size: 1.2rem; letter-spacing: 2px;">ВСПЫШКА</span>
            <span id="user-info" style="font-size: 0.8rem; opacity: 0.6;"></span>
        </header>
        <div id="list-container">
            <div id="empty-hint">Здесь будет список ваших переписок.<br>Нажмите на плюс, чтобы найти собеседника.</div>
        </div>
        <div class="fab" onclick="searchUser()">+</div>
    </div>

    <div id="chat-window">
        <div class="chat-header">
            <span class="back-btn" onclick="closeChat()">‹</span>
            <div id="header-avatar" class="avatar" style="width: 40px; height: 40px; font-size: 1rem;">?</div>
            <div>
                <div id="header-name" style="font-weight: bold;">Имя</div>
                <div id="header-nick" style="font-size: 0.7rem; color: var(--gray);">@nick</div>
            </div>
        </div>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-text" placeholder="Сообщение..." autocomplete="off">
            <button onclick="sendMsg()">OK</button>
        </div>
    </div>

    <script>
        const API_KEY = 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig';
        let ably, myNick, myName, currentPeer, currentChannel;
        let chatList = JSON.parse(localStorage.getItem('flash_chats_v2') || "{}");

        function login() {
            myName = document.getElementById('my-name').value.trim();
            myNick = document.getElementById('my-nick').value.trim().toLowerCase();
            
            if (!myName || !myNick) return alert("Заполните имя и ник!");
            
            localStorage.setItem('flash_name', myName);
            localStorage.setItem('flash_nick', myNick);
            
            ably = new Ably.Realtime(API_KEY);
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('user-info').innerText = `${myName} (@${myNick})`;
            
            renderList();
            initInbox();
        }

        function initInbox() {
            const inbox = ably.channels.get('inbox-' + myNick);
            inbox.subscribe('alert', (m) => {
                const senderNick = m.data.fromNick;
                const senderName = m.data.fromName;
                
                if (!chatList[senderNick]) {
                    chatList[senderNick] = { name: senderName };
                    save();
                    renderList();
                }
                if (currentPeer !== senderNick) {
                    alert(`Новое сообщение от ${senderName} (@${senderNick})`);
                }
            });
        }

        function renderList() {
            const container = document.getElementById('list-container');
            const nicks = Object.keys(chatList);
            
            if (nicks.length > 0) {
                container.innerHTML = '';
                nicks.forEach(nick => {
                    const data = chatList[nick];
                    const div = document.createElement('div');
                    div.className = 'chat-item';
                    div.onclick = () => openChat(nick, data.name);
                    div.innerHTML = `
                        <div class="avatar">${data.name[0].toUpperCase()}</div>
                        <div>
                            <div style="font-weight:bold;">${data.name}</div>
                            <div style="font-size:0.8rem; color:var(--gray);">@${nick}</div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }
        }

        function searchUser() {
            const nick = prompt("Введите НИКНЕЙМ пользователя:");
            if (nick && nick.toLowerCase() !== myNick) {
                const target = nick.toLowerCase();
                const name = prompt(`Как назвать этого пользователя (Имя)?`) || target;
                
                if (!chatList[target]) {
                    chatList[target] = { name: name };
                    save();
                }
                openChat(target, name);
            }
        }

        function openChat(nick, name) {
            currentPeer = nick;
            document.getElementById('chat-window').style.display = 'flex';
            document.getElementById('header-name').innerText = name;
            document.getElementById('header-nick').innerText = "@" + nick;
            document.getElementById('header-avatar').innerText = name[0].toUpperCase();
            document.getElementById('messages').innerHTML = '';

            const channelID = [myNick, currentPeer].sort().join('-to-');
            currentChannel = ably.channels.get(channelID);
            
            currentChannel.subscribe('msg', (m) => {
                const box = document.getElementById('messages');
                const isMe = m.data.senderNick === myNick;
                const d = document.createElement('div');
                d.className = `msg ${isMe ? 'out' : 'in'}`;
                d.innerText = m.data.text;
                box.appendChild(d);
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg() {
            const input = document.getElementById('m-text');
            const text = input.value.trim();
            if (text && currentChannel) {
                currentChannel.publish('msg', { 
                    senderNick: myNick, 
                    senderName: myName, 
                    text: text 
                });
                
                // Стучимся в инбокс собеседника
                const inbox = ably.channels.get('inbox-' + currentPeer);
                inbox.publish('alert', { fromNick: myNick, fromName: myName, text: text });
                
                input.value = '';
            }
        }

        function closeChat() {
            if(currentChannel) currentChannel.unsubscribe();
            document.getElementById('chat-window').style.display = 'none';
            currentPeer = null;
            renderList();
        }

        function save() { localStorage.setItem('flash_chats_v2', JSON.stringify(chatList)); }

        window.onload = () => {
            const sn = localStorage.getItem('flash_nick');
            const sm = localStorage.getItem('flash_name');
            if(sn) document.getElementById('my-nick').value = sn;
            if(sm) document.getElementById('my-name').value = sm;
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Вспышка — Соцсеть</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --accent: #ff8c00;
            --text: #ffffff;
            --msg-in: #1e1e1e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(20px);
        }

        .login-card {
            background: var(--card);
            padding: 40px 25px;
            border-radius: 30px;
            width: 90%;
            max-width: 360px;
            border: 1px solid #222;
            text-align: center;
        }

        .login-card h1 { color: var(--accent); margin-bottom: 25px; letter-spacing: 3px; }

        #chat-app { width: 100%; max-width: 600px; display: flex; flex-direction: column; }

        header {
            padding: 20px;
            background: var(--card);
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            word-wrap: break-word;
            position: relative;
            line-height: 1.4;
        }

        .in { align-self: flex-start; background: var(--msg-in); border-bottom-left-radius: 4px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; font-weight: 500; }

        .name { font-size: 0.7rem; font-weight: 900; opacity: 0.5; margin-bottom: 4px; display: block; text-transform: uppercase; }

        .input-area {
            padding: 15px 15px 50px 15px; /* Защита от кнопок навигации */
            background: var(--card);
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px 20px;
            border-radius: 30px;
            color: #fff;
            outline: none;
            font-size: 16px;
        }

        input:focus { border-color: var(--accent); }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0 25px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .system { align-self: center; font-size: 0.7rem; color: var(--accent); opacity: 0.6; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h1>ВСПЫШКА</h1>
            <input type="text" id="reg-name" placeholder="Придумайте никнейм" style="margin-bottom:10px;"><br>
            <input type="text" id="reg-id" placeholder="ID собеседника (или общее)">
            <p style="font-size: 0.7rem; color: #666; margin-top: 10px;">Ник сохранится в этом браузере</p>
            <br>
            <button onclick="register()" style="width: 100%; height: 50px;">ВОЙТИ</button>
        </div>
    </div>

    <div id="chat-app">
        <header>
            <span style="font-weight: 900; color: var(--accent);">ВСПЫШКА</span>
            <span id="my-id-display" style="font-size: 0.8rem; opacity: 0.5;"></span>
        </header>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="m-input" placeholder="Сообщение...">
            <button onclick="send()">OK</button>
        </div>
    </div>

    <script>
        const API_KEY = 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig';
        let ably, channel, myName;

        // Проверка сохраненного ника
        window.onload = () => {
            const savedName = localStorage.getItem('vspyshka_name');
            if (savedName) document.getElementById('reg-name').value = savedName;
        };

        async function register() {
            const name = document.getElementById('reg-name').value.trim();
            const chatID = document.getElementById('reg-id').value.trim() || 'main';

            if (!name) return alert("Введите ник!");

            ably = new Ably.Realtime(API_KEY);
            channel = ably.channels.get(chatID);

            // Имитация проверки занятости ника (через Presence)
            channel.presence.get((err, members) => {
                const isTaken = members.some(m => m.clientId === name);
                if (isTaken) {
                    alert("Этот ник сейчас занят в этой комнате!");
                } else {
                    myName = name;
                    localStorage.setItem('vspyshka_name', name);
                    channel.presence.enter();
                    
                    channel.subscribe('msg', (m) => render(m.data.user, m.data.text));
                    channel.publish('msg', { user: 'СИСТЕМА', text: `${myName} теперь во Вспышке!` });

                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('my-id-display').innerText = `@${myName} | ID: ${chatID}`;
                }
            });
        }

        function send() {
            const el = document.getElementById('m-input');
            if (el.value.trim() && channel) {
                channel.publish('msg', { user: myName, text: el.value });
                el.value = '';
            }
        }

        function render(user, text) {
            const box = document.getElementById('messages');
            const isMe = user === myName;
            const isSys = user === 'СИСТЕМА';
            
            const d = document.createElement('div');
            if (isSys) {
                d.className = 'system';
                d.innerText = text;
            } else {
                d.className = `bubble ${isMe ? 'out' : 'in'}`;
                d.innerHTML = `<span class="name">${user}</span>${text}`;
            }
            
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        document.addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                if (document.getElementById('login-overlay').style.display !== 'none') register();
                else send();
            }
        });
    </script>
</body>
</html>

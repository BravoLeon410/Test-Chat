<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }

        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        #auth-screen { display: flex; justify-content: center; align-items: center; z-index: 1000; }
        
        header { padding: 15px 20px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .chat-item { padding: 15px 20px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .chat-info { flex: 1; overflow: hidden; }
        .last-msg { font-size: 0.8rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        
        .avatar { width: 45px; height: 45px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; flex-shrink: 0; }
        .fab { position: fixed; bottom: 30px; right: 20px; width: 55px; height: 55px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #000; z-index: 100; }

        #search-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .search-box { background: var(--card); width: 85%; padding: 20px; border-radius: 15px; text-align: center; }

        #chat-window { z-index: 1500; }
        .chat-header { padding: 10px 15px; background: var(--card); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #222; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #080808; }
        
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 15px; }
        .in { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }

        .input-bar { padding: 10px 15px 30px 15px; background: var(--card); display: flex; gap: 8px; border-top: 1px solid #222; }
        input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 10px 15px; border-radius: 20px; color: #fff; outline: none; }
        .btn { background: var(--accent); color: #000; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen">
        <div class="auth-box" style="text-align: center; width: 80%;">
            <h1 style="color:var(--accent); margin-bottom:20px;">ВСПЫШКА</h1>
            <input type="text" id="reg-name" placeholder="Имя" style="width:100%; margin-bottom:10px; padding:12px;">
            <input type="text" id="reg-nick" placeholder="Никнейм" style="width:100%; margin-bottom:20px; padding:12px;">
            <button class="btn" id="login-btn" onclick="app.preLogin()" style="width:100%;">ВОЙТИ</button>
        </div>
    </div>

    <div id="list-screen" class="screen">
        <header>
            <div><b style="color:var(--accent);">ВСПЫШКА</b><br><span id="my-info" style="font-size:0.7rem; opacity:0.5;"></span></div>
            <div onclick="app.logout()" style="color:#ff4444; border:1px solid #ff4444; padding:3px 8px; border-radius:5px; font-size:0.7rem;">ВЫЙТИ</div>
        </header>
        <div id="chat-items-container" style="flex: 1; overflow-y: auto;"></div>
        <div class="fab" onclick="app.showSearch()">+</div>
    </div>

    <div id="search-modal">
        <div class="search-box">
            <h4 style="margin-bottom:15px; color:var(--accent);">Найти пользователя</h4>
            <input type="text" id="search-input" placeholder="@ник..." style="width:100%; margin-bottom:15px; padding:12px;">
            <button class="btn" id="search-btn" onclick="app.findUser()" style="width: 100%;">ПОИСК</button>
            <button class="btn" style="background:#333; color:#fff; margin-top:8px; width: 100%;" onclick="app.hideSearch()">ОТМЕНА</button>
        </div>
    </div>

    <div id="chat-window" class="screen">
        <div class="chat-header">
            <span onclick="app.closeChat()" style="font-size:2rem; color:var(--accent); padding:0 10px;">‹</span>
            <div id="c-avatar" class="avatar" style="width:35px; height:35px; font-size:0.8rem;">?</div>
            <div id="c-name" style="font-weight:bold; flex:1;">Имя</div>
        </div>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-input" placeholder="Сообщение...">
            <button class="btn" onclick="app.send()">OK</button>
        </div>
    </div>

    <script>
        const app = {
            key: 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig',
            ably: null,
            me: { nick: '', name: '', time: 0 },
            currentNick: '',
            chats: JSON.parse(localStorage.getItem('v9_chats') || "{}"),
            history: JSON.parse(localStorage.getItem('v9_hist') || "{}"),

            preLogin() {
                const name = document.getElementById('reg-name').value.trim();
                const nick = document.getElementById('reg-nick').value.trim().toLowerCase().replace('@','');
                if(!name || !nick) return alert("Заполни поля!");
                
                const btn = document.getElementById('login-btn');
                btn.disabled = true; btn.innerText = "ПРОВЕРКА...";

                const temp = new Ably.Realtime(this.key);
                const chan = temp.channels.get('v9-core');
                let taken = false;

                chan.subscribe('presence-check-' + nick, () => {
                    taken = true; alert("Этот никнейм занят пользователем в сети!");
                    btn.disabled = false; btn.innerText = "ВОЙТИ";
                    temp.close();
                });
                chan.publish('is-anybody-here', { nick });

                setTimeout(() => {
                    if(!taken) { temp.close(); this.login(name, nick, Date.now()); }
                }, 2500);
            },

            login(name, nick, time) {
                this.me = { name, nick, time };
                localStorage.setItem('v9_n', name); localStorage.setItem('v9_u', nick); localStorage.setItem('v9_t', time);
                this.ably = new Ably.Realtime({ key: this.key, clientId: nick });
                
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('list-screen').style.display = 'flex';
                document.getElementById('my-info').innerText = `@${nick}`;
                
                this.initCore();
                this.renderList();
            },

            initCore() {
                const core = this.ably.channels.get('v9-core');
                
                // Ответ на проверку ника
                core.subscribe('is-anybody-here', (m) => {
                    if(m.data.nick === this.me.nick) core.publish('presence-check-' + this.me.nick, { ok: true });
                });

                // Ответ на поиск
                core.subscribe('find-request', (m) => {
                    if(m.data.target === this.me.nick) {
                        core.publish('find-response-' + m.data.from, { nick: this.me.nick, name: this.me.name });
                    }
                });

                // Персональные уведомления
                const personal = this.ably.channels.get('v9-notify-' + this.me.nick);
                personal.subscribe('msg', (m) => {
                    this.onReceive(m.data.from, m.data.name, m.data.text);
                });

                // Кик самозванцев
                core.subscribe('iam-' + this.me.nick, (m) => {
                    if(m.data.t < this.me.time) this.logout();
                    else if(m.data.t > this.me.time) core.publish('kick-' + this.me.nick, { t: this.me.time });
                });
                core.subscribe('kick-' + this.me.nick, (m) => { if(m.data.t < this.me.time) this.logout(); });
                core.publish('iam-' + this.me.nick, { t: this.me.time });
            },

            findUser() {
                const target = document.getElementById('search-input').value.trim().toLowerCase().replace('@','');
                if(!target || target === this.me.nick) return;
                
                const btn = document.getElementById('search-btn');
                btn.disabled = true; btn.innerText = "ИЩЕМ...";
                
                const core = this.ably.channels.get('v9-core');
                let found = false;

                const sub = core.subscribe('find-response-' + this.me.nick, (m) => {
                    if(m.data.nick === target) {
                        found = true; core.unsubscribe('find-response-' + this.me.nick);
                        this.hideSearch(); this.openChat(target, m.data.name);
                        btn.disabled = false; btn.innerText = "ПОИСК";
                    }
                });

                core.publish('find-request', { target, from: this.me.nick });
                setTimeout(() => { 
                    if(!found) { 
                        alert("Пользователь не в сети"); 
                        btn.disabled = false; btn.innerText = "ПОИСК";
                        core.unsubscribe('find-response-' + this.me.nick);
                    }
                }, 5000);
            },

            onReceive(from, name, text) {
                if(!this.chats[from]) this.chats[from] = { name };
                if(!this.history[from]) this.history[from] = [];
                this.history[from].push({ f: from, t: text });
                this.save();
                if(this.currentNick === from) this.renderMsg(false, text);
                this.renderList();
            },

            openChat(nick, name) {
                this.currentNick = nick;
                document.getElementById('chat-window').style.display = 'flex';
                document.getElementById('c-name').innerText = name;
                document.getElementById('c-avatar').innerText = name[0].toUpperCase();
                const box = document.getElementById('messages'); box.innerHTML = '';
                if(this.history[nick]) this.history[nick].forEach(m => this.renderMsg(m.f === this.me.nick, m.t));
            },

            send() {
                const i = document.getElementById('m-input');
                const text = i.value.trim();
                if(!text || !this.currentNick) return;

                // Сохраняем у себя
                if(!this.chats[this.currentNick]) this.chats[this.currentNick] = { name: document.getElementById('c-name').innerText };
                if(!this.history[this.currentNick]) this.history[this.currentNick] = [];
                this.history[this.currentNick].push({ f: this.me.nick, t: text });
                this.save();

                // Отправляем собеседнику
                this.ably.channels.get('v9-notify-' + this.currentNick).publish('msg', { from: this.me.nick, name: this.me.name, text });
                
                this.renderMsg(true, text);
                this.renderList();
                i.value = '';
            },

            renderMsg(me, t) {
                const b = document.getElementById('messages');
                const d = document.createElement('div');
                d.className = `msg ${me ? 'out' : 'in'}`; d.innerText = t;
                b.appendChild(d); b.scrollTop = b.scrollHeight;
            },

            renderList() {
                const c = document.getElementById('chat-items-container'); c.innerHTML = '';
                for(let n in this.chats) {
                    const h = this.history[n] || [];
                    const last = h.length > 0 ? h[h.length-1].t : "...";
                    const d = document.createElement('div'); d.className = 'chat-item';
                    d.onclick = () => this.openChat(n, this.chats[n].name);
                    d.innerHTML = `<div class="avatar">${this.chats[n].name[0].toUpperCase()}</div>
                        <div class="chat-info"><div style="font-weight:bold;">${this.chats[n].name}</div>
                        <div class="last-msg">${last}</div></div>`;
                    c.appendChild(d);
                }
            },

            showSearch() { document.getElementById('search-modal').style.display = 'flex'; },
            hideSearch() { document.getElementById('search-modal').style.display = 'none'; },
            closeChat() { this.currentNick = ''; document.getElementById('chat-window').style.display = 'none'; },
            save() { localStorage.setItem('v9_chats', JSON.stringify(this.chats)); localStorage.setItem('v9_hist', JSON.stringify(this.history)); },
            logout() { localStorage.clear(); location.reload(); }
        };

        window.onload = () => {
            const n = localStorage.getItem('v9_n'), u = localStorage.getItem('v9_u'), t = localStorage.getItem('v9_t');
            if(n && u) app.login(n, u, parseInt(t));
            else document.getElementById('auth-screen').style.display = 'flex';
        };
    </script>
</body>
</html>

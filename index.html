<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА v16.1</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }
        
        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        header { padding: 15px 20px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        
        .my-info { padding: 10px 20px; background: #080808; border-bottom: 1px solid #111; font-size: 0.85rem; color: var(--gray); }
        .my-info b { color: var(--accent); }

        /* УВЕДОМЛЕНИЕ (Кликабельное) */
        #push-notif { 
            position: fixed; top: -100px; left: 10px; right: 10px; 
            background: #1e1e1e; padding: 15px; border-radius: 12px; 
            z-index: 9999; transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); 
            border-left: 4px solid var(--accent); cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        #push-notif.show { top: 20px; }

        .chat-item { padding: 15px 20px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .avatar { width: 48px; height: 48px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; flex-shrink: 0; }
        
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #050505; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 18px; font-size: 15px; }
        .in { align-self: flex-start; background: #222; }
        .out { align-self: flex-end; background: var(--accent); color: #000; }

        .input-bar { padding: 10px 15px 35px; background: var(--card); display: flex; gap: 10px; }
        input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 12px; border-radius: 25px; color: #fff; outline: none; }
        .btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="push-notif" onclick="app.openChatFromPush()">
        <b id="p-name" style="color:var(--accent)"></b><br>
        <span id="p-msg"></span>
    </div>

    <div id="auth-screen" class="screen" style="display: flex; justify-content: center; align-items: center;">
        <div style="width: 80%; text-align: center;">
            <h1 style="color:var(--accent); margin-bottom:30px;">ВСПЫШКА</h1>
            <input type="text" id="reg-name" placeholder="Имя" style="width:100%; margin-bottom:10px;">
            <input type="text" id="reg-nick" placeholder="Ник (@nick)" style="width:100%; margin-bottom:20px;">
            <button class="btn" onclick="app.loginAction()" style="width:100%">ВОЙТИ</button>
        </div>
    </div>

    <div id="list-screen" class="screen">
        <header><b>ВСПЫШКА</b> <span onclick="app.logout()" style="color:red; font-size:0.8rem">ВЫЙТИ</span></header>
        <div class="my-info">Ваш ник: <b id="my-display-nick">...</b></div>
        <div id="chat-list" style="flex:1; overflow-y:auto"></div>
        <button class="btn" style="margin:20px;" onclick="app.findUser()">+ НАЙТИ ПОЛЬЗОВАТЕЛЯ</button>
    </div>

    <div id="chat-window" class="screen">
        <header>
            <span onclick="app.closeChat()" style="font-size:1.2rem; color:var(--accent)">‹ Назад</span>
            <b id="c-name">Имя</b>
            <span style="opacity:0">i</span>
        </header>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-input" placeholder="Сообщение...">
            <button class="btn" onclick="app.send()">ОК</button>
        </div>
    </div>

    <script>
        const app = {
            key: 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig',
            ably: null,
            me: { nick: '', name: '' },
            current: null,
            lastPushNick: null, // Запоминаем, от кого последнее уведомление
            chats: JSON.parse(localStorage.getItem('v16_chats') || "{}"),
            history: JSON.parse(localStorage.getItem('v16_hist') || "{}"),

            loginAction() {
                const name = document.getElementById('reg-name').value.trim();
                const nick = document.getElementById('reg-nick').value.trim().toLowerCase().replace('@','');
                if(name && nick) this.login(name, nick);
            },

            login(name, nick) {
                this.me = { name, nick };
                localStorage.setItem('v16_me', JSON.stringify(this.me));
                document.getElementById('my-display-nick').innerText = '@' + nick;
                
                this.ably = new Ably.Realtime({ key: this.key, clientId: nick });
                
                // Подписка на личные сообщения
                this.ably.channels.get('v16-u-' + nick).subscribe('msg', (m) => {
                    const { from, fromName, text } = m.data;
                    if(!this.chats[from]) this.chats[from] = { name: fromName };
                    if(!this.history[from]) this.history[from] = [];
                    this.history[from].push({ f: from, t: text });
                    this.save();
                    
                    if(this.current === from) {
                        this.renderMsg(false, text);
                    } else {
                        this.showPush(from, fromName, text);
                    }
                    this.renderList();
                });

                // Входим в глобальный список присутствия
                this.ably.channels.get('v16-global').presence.enter({ name });

                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('list-screen').style.display = 'flex';
                this.renderList();
            },

            showPush(nick, name, msg) {
                this.lastPushNick = nick; // Сохраняем ник отправителя
                document.getElementById('p-name').innerText = name;
                document.getElementById('p-msg').innerText = msg.length > 40 ? msg.slice(0,40) + '...' : msg;
                document.getElementById('push-notif').classList.add('show');
                
                clearTimeout(this.pushTimer);
                this.pushTimer = setTimeout(() => this.closePush(), 5000);
            },

            openChatFromPush() {
                if(this.lastPushNick) {
                    this.openChat(this.lastPushNick, this.chats[this.lastPushNick].name);
                    this.closePush();
                }
            },

            openChat(nick, name) {
                this.current = nick;
                document.getElementById('chat-window').style.display = 'flex';
                document.getElementById('c-name').innerText = name;
                this.renderChat();
            },

            send() {
                const i = document.getElementById('m-input');
                const txt = i.value.trim();
                if(!txt || !this.current) return;
                
                if(!this.history[this.current]) this.history[this.current] = [];
                this.history[this.current].push({ f: this.me.nick, t: txt });
                
                this.ably.channels.get('v16-u-' + this.current).publish('msg', { 
                    from: this.me.nick, 
                    fromName: this.me.name, 
                    text: txt 
                });
                
                this.renderMsg(true, txt);
                this.save();
                i.value = '';
                this.renderList();
            },

            findUser() {
                const target = prompt("Ник пользователя (@nick):").toLowerCase().replace('@','');
                if(!target || target === this.me.nick) return;
                
                this.ably.channels.get('v16-global').presence.get((err, members) => {
                    const user = members.find(m => m.clientId === target);
                    if(user) {
                        const name = user.data.name || target;
                        this.chats[target] = { name };
                        this.save();
                        this.openChat(target, name);
                        this.renderList();
                    } else {
                        alert("Пользователь не в сети.");
                    }
                });
            },

            renderMsg(me, t) {
                const b = document.getElementById('messages');
                const d = document.createElement('div');
                d.className = `msg ${me ? 'out' : 'in'}`; d.innerText = t;
                b.appendChild(d); b.scrollTop = b.scrollHeight;
            },

            renderChat() {
                const b = document.getElementById('messages'); b.innerHTML = '';
                (this.history[this.current] || []).forEach(m => this.renderMsg(m.f === this.me.nick, m.t));
            },

            renderList() {
                const l = document.getElementById('chat-list'); l.innerHTML = '';
                for(let id in this.chats) {
                    const lastMsg = this.history[id] ? this.history[id][this.history[id].length-1].t : 'Нет сообщений';
                    const d = document.createElement('div'); d.className = 'chat-item';
                    d.onclick = () => this.openChat(id, this.chats[id].name);
                    d.innerHTML = `<div class="avatar">${this.chats[id].name[0].toUpperCase()}</div>
                                   <div><b>${this.chats[id].name}</b><br><small style="color:var(--gray)">${lastMsg.slice(0,20)}...</small></div>`;
                    l.appendChild(d);
                }
            },

            closePush() { document.getElementById('push-notif').classList.remove('show'); },
            closeChat() { this.current = null; document.getElementById('chat-window').style.display = 'none'; },
            save() { localStorage.setItem('v16_chats', JSON.stringify(this.chats)); localStorage.setItem('v16_hist', JSON.stringify(this.history)); },
            logout() { localStorage.removeItem('v16_me'); location.reload(); }
        };

        window.onload = () => {
            const saved = localStorage.getItem('v16_me');
            if(saved) { const u = JSON.parse(saved); app.login(u.name, u.nick); }
            else document.getElementById('auth-screen').style.display = 'flex';
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; user-select: none; -webkit-user-select: none; }
        
        input, .msg { user-select: text; -webkit-user-select: text; }

        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        #auth-screen { display: flex; justify-content: center; align-items: center; z-index: 1000; }
        
        header { padding: 15px 20px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        
        .logout-btn { 
            color: #ff4444; border: 1px solid #ff4444; padding: 6px 14px; border-radius: 10px; font-size: 0.8rem; 
            font-weight: bold; cursor: pointer; transition: 0.1s;
        }
        .logout-btn:active { transform: scale(0.9); background: rgba(255, 68, 68, 0.1); }

        .chat-item { padding: 15px 20px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 15px; }
        .chat-info { flex: 1; overflow: hidden; }
        .last-msg { font-size: 0.85rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
        
        .avatar { width: 48px; height: 48px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; flex-shrink: 0; font-size: 1.2rem; }
        .fab { position: fixed; bottom: 30px; right: 25px; width: 65px; height: 65px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; color: #000; z-index: 100; box-shadow: 0 5px 20px rgba(255,140,0,0.4); }

        #search-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .search-box { background: var(--card); width: 85%; padding: 30px; border-radius: 25px; text-align: center; border: 1px solid #333; }

        /* ИСПРАВЛЕННЫЙ БЛОК КНОПОК: СТРОГО В РЯД */
        .search-btns { 
            display: flex; 
            flex-direction: row; /* Направление в ряд */
            justify-content: space-between; 
            gap: 12px; 
            margin-top: 20px; 
            width: 100%;
        }
        .search-btns .btn { 
            flex: 1; /* Одинаковая ширина */
            height: 50px; 
            white-space: nowrap;
        }

        #chat-window { z-index: 1500; }
        .chat-header { padding: 12px 15px; background: var(--card); display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #222; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #050505; }
        
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 16px; line-height: 1.4; word-wrap: break-word; }
        .in { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }

        .input-bar { padding: 10px 15px 40px 15px; background: var(--card); display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 12px 20px; border-radius: 30px; color: #fff; outline: none; font-size: 16px; }
        .btn { background: var(--accent); color: #000; border: none; padding: 10px 15px; border-radius: 30px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen">
        <div class="auth-box" style="text-align: center; width: 85%;">
            <h1 style="color:var(--accent); font-size: 2.8rem; margin-bottom: 10px; letter-spacing: 2px;">ВСПЫШКА</h1>
            <p style="color: var(--gray); margin-bottom: 30px;">Тестовая Соцсеть</p>
            <input type="text" id="reg-name" placeholder="Ваше имя" style="width:100%; margin-bottom:12px;">
            <input type="text" id="reg-nick" placeholder="Никнейм (@nick)" style="width:100%; margin-bottom:20px;">
            <button class="btn" id="login-btn" onclick="app.preCheck()" style="width:100%; height: 55px; font-size: 1.1rem;">ВОЙТИ</button>
        </div>
    </div>

    <div id="list-screen" class="screen">
        <header>
            <div><b style="color:var(--accent); font-size: 1.2rem;">ВСПЫШКА</b><br><span id="my-info" style="font-size:0.75rem; opacity:0.6;"></span></div>
            <div class="logout-btn" onclick="app.logout()">ВЫЙТИ</div>
        </header>
        <div id="chat-items-container" style="flex: 1; overflow-y: auto;"></div>
        <div class="fab" onclick="app.showSearch()">+</div>
    </div>

    <div id="search-modal">
        <div class="search-box">
            <h3 style="color:var(--accent); margin-bottom:10px;">Поиск пользователя</h3>
            <p id="search-status" style="font-size: 0.7rem; color: var(--gray); margin-bottom: 15px;">Введите @ник</p>
            <input type="text" id="search-input" placeholder="@ник..." style="width:100%;">
            <div class="search-btns">
                <button class="btn" id="search-btn" onclick="app.findUser()">НАЙТИ</button>
                <button class="btn" style="background:#222; color:#fff;" onclick="app.hideSearch()">ОТМЕНА</button>
            </div>
        </div>
    </div>

    <div id="chat-window" class="screen">
        <div class="chat-header">
            <div onclick="app.closeChat()" style="font-size:2.5rem; color:var(--accent); padding: 0 10px; cursor: pointer;">‹</div>
            <div id="c-avatar" class="avatar" style="width:40px; height:40px; font-size: 1rem;">?</div>
            <div id="c-name" style="font-weight:bold; flex:1; margin-left: 5px;">Имя</div>
        </div>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-input" placeholder="Сообщение...">
            <button class="btn" onclick="app.send()">ОК</button>
        </div>
    </div>

    <script>
        const app = {
            key: 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig',
            ably: null,
            me: { nick: '', name: '', time: 0 },
            currentNick: '',
            chats: JSON.parse(localStorage.getItem('v11_chats') || "{}"),
            history: JSON.parse(localStorage.getItem('v11_hist') || "{}"),

            preCheck() {
                const name = document.getElementById('reg-name').value.trim();
                const nick = document.getElementById('reg-nick').value.trim().toLowerCase().replace('@','');
                if(!name || !nick) return alert("Заполни все поля!");
                
                const btn = document.getElementById('login-btn');
                btn.disabled = true; btn.innerText = "ПРОВЕРКА...";

                const temp = new Ably.Realtime(this.key);
                const chan = temp.channels.get('v11-auth');
                let isTaken = false;

                chan.subscribe('presence-' + nick, () => {
                    isTaken = true; alert("Никнейм сейчас в сети!");
                    btn.disabled = false; btn.innerText = "ВОЙТИ";
                    temp.close();
                });
                chan.publish('ping', { nick });

                setTimeout(() => {
                    if(!isTaken) { temp.close(); this.login(name, nick, Date.now()); }
                }, 2000);
            },

            login(name, nick, time) {
                this.me = { name, nick, time };
                localStorage.setItem('v11_n', name); localStorage.setItem('v11_u', nick); localStorage.setItem('v11_t', time);
                this.ably = new Ably.Realtime({ key: this.key, clientId: nick });
                
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('list-screen').style.display = 'flex';
                document.getElementById('my-info').innerText = `@${nick}`;
                
                this.initAppLogic();
                this.renderList();
                
                setInterval(() => {
                    if(this.ably) this.ably.channels.get('v11-auth').publish('heartbeat', { nick: this.me.nick });
                }, 15000);
            },

            initAppLogic() {
                const auth = this.ably.channels.get('v11-auth');
                auth.subscribe('ping', (m) => { if(m.data.nick === this.me.nick) auth.publish('presence-' + this.me.nick, { t: this.me.time }); });
                auth.subscribe('find', (m) => {
                    if(m.data.target === this.me.nick) auth.publish('found-' + m.data.from, { nick: this.me.nick, name: this.me.name });
                });

                const notify = this.ably.channels.get('v11-notif-' + this.me.nick);
                notify.subscribe('msg', (m) => {
                    const { from, name, text } = m.data;
                    if(!this.chats[from]) { this.chats[from] = { name }; this.save(); }
                    if(!this.history[from]) this.history[from] = [];
                    this.history[from].push({ f: from, t: text });
                    this.save();
                    if(this.currentNick === from) this.renderMsg(false, text);
                    this.renderList();
                });

                auth.subscribe('iam-' + this.me.nick, (m) => {
                    if (m.data.t < this.me.time) this.logout();
                    else if (m.data.t > this.me.time) auth.publish('kick-' + this.me.nick, { t: this.me.time });
                });
                auth.subscribe('kick-' + this.me.nick, (m) => { if(m.data.t < this.me.time) this.logout(); });
                auth.publish('iam-' + this.me.nick, { t: this.me.time });
            },

            findUser() {
                const target = document.getElementById('search-input').value.trim().toLowerCase().replace('@','');
                if(!target || target === this.me.nick) return;
                
                const btn = document.getElementById('search-btn');
                const status = document.getElementById('search-status');
                btn.disabled = true; btn.innerText = "...";
                status.innerText = "Отправка запроса...";
                
                const auth = this.ably.channels.get('v11-auth');
                let found = false;

                const sub = auth.subscribe('found-' + this.me.nick, (m) => {
                    if(m.data.nick === target && !found) {
                        found = true;
                        auth.unsubscribe('found-' + this.me.nick);
                        this.hideSearch();
                        this.openChat(target, m.data.name);
                        btn.disabled = false; btn.innerText = "НАЙТИ";
                        status.innerText = "Введите @ник";
                    }
                });

                let count = 0;
                const loop = setInterval(() => {
                    if(found || count >= 3) { clearInterval(loop); return; }
                    status.innerText = `Попытка ${count + 1} из 3...`;
                    auth.publish('find', { target, from: this.me.nick });
                    count++;
                }, 1000);

                setTimeout(() => { 
                    if(!found) { 
                        alert("Не в сети. Проверьте, что приложение открыто на том телефоне."); 
                        btn.disabled = false; btn.innerText = "НАЙТИ"; 
                        status.innerText = "Не найден";
                        auth.unsubscribe('found-' + this.me.nick); 
                    }
                }, 5000);
            },

            openChat(nick, name) {
                this.currentNick = nick;
                document.getElementById('chat-window').style.display = 'flex';
                document.getElementById('c-name').innerText = name;
                document.getElementById('c-avatar').innerText = name[0].toUpperCase();
                const box = document.getElementById('messages'); box.innerHTML = '';
                if(this.history[nick]) this.history[nick].forEach(m => this.renderMsg(m.f === this.me.nick, m.t));
            },

            send() {
                const i = document.getElementById('m-input');
                const text = i.value.trim();
                if(!text || !this.currentNick) return;
                if(!this.chats[this.currentNick]) this.chats[this.currentNick] = { name: document.getElementById('c-name').innerText };
                if(!this.history[this.currentNick]) this.history[this.currentNick] = [];
                this.history[this.currentNick].push({ f: this.me.nick, t: text });
                this.save();
                this.ably.channels.get('v11-notif-' + this.currentNick).publish('msg', { from: this.me.nick, name: this.me.name, text });
                this.renderMsg(true, text);
                this.renderList();
                i.value = '';
            },

            renderMsg(me, t) {
                const b = document.getElementById('messages');
                const d = document.createElement('div');
                d.className = `msg ${me ? 'out' : 'in'}`; d.innerText = t;
                b.appendChild(d); b.scrollTop = b.scrollHeight;
            },

            renderList() {
                const c = document.getElementById('chat-items-container'); c.innerHTML = '';
                const keys = Object.keys(this.chats);
                if(keys.length === 0) c.innerHTML = '<div style="text-align:center; margin-top:50px; opacity:0.3;">Список чатов пуст</div>';
                keys.forEach(n => {
                    const h = this.history[n] || [];
                    const last = h.length > 0 ? h[h.length-1].t : "...";
                    const d = document.createElement('div'); d.className = 'chat-item';
                    d.onclick = () => this.openChat(n, this.chats[n].name);
                    d.innerHTML = `<div class="avatar">${this.chats[n].name[0].toUpperCase()}</div>
                        <div class="chat-info"><div style="font-weight:bold;">${this.chats[n].name}</div>
                        <div class="last-msg">${last}</div></div>`;
                    c.appendChild(d);
                });
            },

            showSearch() { document.getElementById('search-modal').style.display = 'flex'; },
            hideSearch() { document.getElementById('search-modal').style.display = 'none'; },
            closeChat() { this.currentNick = ''; document.getElementById('chat-window').style.display = 'none'; this.renderList(); },
            save() { localStorage.setItem('v11_chats', JSON.stringify(this.chats)); localStorage.setItem('v11_hist', JSON.stringify(this.history)); },
            logout() { localStorage.clear(); location.reload(); }
        };

        window.onload = () => {
            const n = localStorage.getItem('v11_n'), u = localStorage.getItem('v11_u'), t = localStorage.getItem('v11_t');
            if(n && u) app.login(n, u, parseInt(t));
            else document.getElementById('auth-screen').style.display = 'flex';
        };
    </script>
</body>
</html>

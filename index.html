<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; user-select: none; }
        
        input, .msg { user-select: text; -webkit-user-select: text; }
        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        
        header { padding: 15px 20px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .my-status { padding: 10px 20px; background: #080808; font-size: 0.85rem; border-bottom: 1px solid #111; color: var(--gray); cursor: pointer; }
        .my-status b { color: var(--accent); }

        .chat-item { padding: 15px 20px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 15px; }
        .avatar { width: 50px; height: 50px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; flex-shrink: 0; cursor: pointer; }
        .last-msg { font-size: 0.85rem; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }

        #push-notif { 
            position: fixed; top: -120px; left: 10px; right: 10px; 
            background: #1e1e1e; padding: 15px; border-radius: 12px; z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-left: 4px solid var(--accent);
            transition: 0.4s; cursor: pointer;
        }
        #push-notif.show { top: 20px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-box { background: var(--card); width: 85%; padding: 30px; border-radius: 25px; border: 1px solid #333; text-align: center; }

        /* ТОТ САМЫЙ ПЛЮСИК */
        .fab { 
            position: fixed; bottom: 30px; right: 25px; width: 65px; height: 65px; 
            background: var(--accent); border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 35px; 
            color: #000; z-index: 100; box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
            cursor: pointer;
        }

        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #050505; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 16px; }
        .in { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }

        .input-bar { padding: 10px 15px 40px; background: var(--card); display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 12px 20px; border-radius: 30px; color: #fff; outline: none; }
        .btn { background: var(--accent); color: #000; border: none; padding: 12px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="push-notif" onclick="app.openFromPush()">
        <b id="push-name" style="color:var(--accent)">Имя</b>
        <div id="push-text" style="font-size:0.85rem; opacity:0.8">Сообщение...</div>
    </div>

    <div id="auth-screen" class="screen" style="display:flex; justify-content:center; align-items:center;">
        <div style="width:85%; text-align:center;">
            <h1 style="color:var(--accent); font-size:2.8rem; margin-bottom:40px;">ВСПЫШКА</h1>
            <input type="text" id="reg-name" placeholder="Ваше имя" style="width:100%; margin-bottom:12px;">
            <input type="text" id="reg-nick" placeholder="Никнейм (@nick)" style="width:100%; margin-bottom:20px;">
            <button class="btn" onclick="app.loginAction()" style="width:100%; height:55px;">ВОЙТИ</button>
        </div>
    </div>

    <div id="list-screen" class="screen">
        <header>
            <b style="color:var(--accent); font-size:1.2rem;">ВСПЫШКА</b>
            <span onclick="app.logout()" style="color:#ff4444; font-size:0.8rem; font-weight:bold;">ВЫЙТИ</span>
        </header>
        <div class="my-status" onclick="app.showEditName()">
             Вы: <span id="my-name-label">...</span> <b id="my-nick-label">@nick</b> (изменить имя)
        </div>
        <div id="chat-list" style="flex:1; overflow-y:auto;"></div>
        <div class="fab" onclick="app.toggleModal('search-modal', true)">+</div>
    </div>

    <div id="search-modal" class="modal">
        <div class="modal-box">
            <h3 style="margin-bottom:20px; color:var(--accent)">Поиск пользователя</h3>
            <input type="text" id="search-input" placeholder="Введите @ник..." style="width:100%; margin-bottom:20px;">
            <div style="display:flex; gap:10px;">
                <button class="btn" style="flex:1; background:#333; color:#fff;" onclick="app.toggleModal('search-modal', false)">ОТМЕНА</button>
                <button class="btn" style="flex:1" onclick="app.findUser()">ОК</button>
            </div>
        </div>
    </div>

    <div id="edit-name-modal" class="modal">
        <div class="modal-box">
            <h3 style="margin-bottom:20px; color:var(--accent)">Изменить имя</h3>
            <input type="text" id="new-name-input" placeholder="Новое имя..." style="width:100%; margin-bottom:20px;">
            <div style="display:flex; gap:10px;">
                <button class="btn" style="flex:1; background:#333; color:#fff;" onclick="app.toggleModal('edit-name-modal', false)">ОТМЕНА</button>
                <button class="btn" style="flex:1" onclick="app.saveNewName()">СОХРАНИТЬ</button>
            </div>
        </div>
    </div>

    <div id="profile-modal" class="modal" onclick="app.toggleModal('profile-modal', false)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div id="prof-avatar" class="avatar" style="margin:0 auto 15px; width:70px; height:70px; font-size:1.8rem;">?</div>
            <h2 id="prof-name">Имя</h2>
            <p id="prof-nick" style="color:var(--accent); margin-top:5px; font-weight:bold;">@nick</p>
            <button class="btn" style="margin-top:25px; width:100%;" onclick="app.toggleModal('profile-modal', false)">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div id="chat-window" class="screen">
        <header>
            <div onclick="app.closeChat()" style="color:var(--accent); font-weight:bold; cursor:pointer;">‹ НАЗАД</div>
            <b id="chat-title" onclick="app.showProfile(app.currentNick)" style="cursor:pointer;">Имя</b>
            <div id="chat-avatar" class="avatar" style="width:35px; height:35px; font-size:0.9rem;" onclick="app.showProfile(app.currentNick)">?</div>
        </header>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-input" placeholder="Сообщение...">
            <button class="btn" onclick="app.send()">ОК</button>
        </div>
    </div>

    <script>
        const app = {
            key: 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig',
            ably: null,
            me: { name: '', nick: '' },
            currentNick: null,
            lastPushFrom: null,
            chats: JSON.parse(localStorage.getItem('v19_chats') || "{}"),
            history: JSON.parse(localStorage.getItem('v19_hist') || "{}"),

            loginAction() {
                const n = document.getElementById('reg-name').value.trim();
                const u = document.getElementById('reg-nick').value.trim().toLowerCase().replace('@','');
                if(n && u) this.init(n, u);
            },

            init(name, nick) {
                this.me = { name, nick };
                localStorage.setItem('v19_me', JSON.stringify(this.me));
                document.getElementById('my-name-label').innerText = name;
                document.getElementById('my-nick-label').innerText = '@' + nick;
                
                this.ably = new Ably.Realtime({ key: this.key, clientId: nick });
                this.ably.channels.get('v19-global').presence.enter({ name });
                
                this.ably.channels.get('v19-u-' + nick).subscribe('msg', (m) => {
                    const { from, fromName, text } = m.data;
                    this.chats[from] = { name: fromName };
                    if(!this.history[from]) this.history[from] = [];
                    this.history[from].push({ f: from, t: text });
                    this.save();
                    if(this.currentNick === from) this.renderMsg(false, text);
                    else this.showPush(from, fromName, text);
                    this.renderList();
                });

                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('list-screen').style.display = 'flex';
                this.renderList();
            },

            saveNewName() {
                const newName = document.getElementById('new-name-input').value.trim();
                if(!newName) return;
                this.me.name = newName;
                localStorage.setItem('v19_me', JSON.stringify(this.me));
                document.getElementById('my-name-label').innerText = newName;
                this.ably.channels.get('v19-global').presence.update({ name: newName });
                this.toggleModal('edit-name-modal', false);
            },

            findUser() {
                const target = document.getElementById('search-input').value.trim().toLowerCase().replace('@','');
                if(!target || target === this.me.nick) return;
                this.ably.channels.get('v19-global').presence.get((err, m) => {
                    const u = m.find(x => x.clientId === target);
                    if(u) {
                        const name = u.data.name || target;
                        this.chats[target] = { name };
                        this.save();
                        this.toggleModal('search-modal', false);
                        this.openChat(target, name);
                        this.renderList();
                    } else alert("Пользователь не найден");
                });
            },

            showProfile(nick) {
                const info = this.chats[nick];
                if(!info) return;
                document.getElementById('prof-name').innerText = info.name;
                document.getElementById('prof-nick').innerText = '@' + nick;
                document.getElementById('prof-avatar').innerText = info.name[0].toUpperCase();
                this.toggleModal('profile-modal', true);
            },

            showPush(nick, name, txt) {
                this.lastPushFrom = nick;
                document.getElementById('push-name').innerText = name;
                document.getElementById('push-text').innerText = txt.slice(0,35) + (txt.length > 35 ? '...' : '');
                document.getElementById('push-notif').classList.add('show');
                clearTimeout(this.pTimer);
                this.pTimer = setTimeout(() => this.closePush(), 5000);
            },

            openFromPush() {
                if(this.lastPushFrom) { this.openChat(this.lastPushFrom, this.chats[this.lastPushFrom].name); this.closePush(); }
            },

            openChat(nick, name) {
                this.currentNick = nick;
                document.getElementById('chat-window').style.display = 'flex';
                document.getElementById('chat-title').innerText = name;
                document.getElementById('chat-avatar').innerText = name[0].toUpperCase();
                const box = document.getElementById('messages'); box.innerHTML = '';
                (this.history[nick] || []).forEach(m => this.renderMsg(m.f === this.me.nick, m.t));
            },

            send() {
                const i = document.getElementById('m-input');
                const t = i.value.trim();
                if(!t || !this.currentNick) return;
                if(!this.history[this.currentNick]) this.history[this.currentNick] = [];
                this.history[this.currentNick].push({ f: this.me.nick, t: t });
                this.ably.channels.get('v19-u-' + this.currentNick).publish('msg', { from: this.me.nick, fromName: this.me.name, text: t });
                this.renderMsg(true, t);
                this.save();
                this.renderList();
                i.value = '';
            },

            renderMsg(me, t) {
                const b = document.getElementById('messages');
                const d = document.createElement('div');
                d.className = `msg ${me ? 'out' : 'in'}`; d.innerText = t;
                b.appendChild(d); b.scrollTop = b.scrollHeight;
            },

            renderList() {
                const l = document.getElementById('chat-list'); l.innerHTML = '';
                for(let id in this.chats) {
                    const h = this.history[id] || [];
                    const last = h.length > 0 ? h[h.length-1].t : "Нет сообщений";
                    const d = document.createElement('div'); d.className = 'chat-item';
                    d.innerHTML = `<div class="avatar" onclick="app.showProfile('${id}'); event.stopPropagation();">${this.chats[id].name[0].toUpperCase()}</div>
                        <div style="flex:1; overflow:hidden;" onclick="app.openChat('${id}', '${this.chats[id].name}')">
                            <div style="font-weight:bold;">${this.chats[id].name}</div>
                            <div class="last-msg">${last}</div>
                        </div>`;
                    l.appendChild(d);
                }
            },

            toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; },
            showEditName() { document.getElementById('new-name-input').value = this.me.name; this.toggleModal('edit-name-modal', true); },
            closePush() { document.getElementById('push-notif').classList.remove('show'); },
            closeChat() { this.currentNick = null; document.getElementById('chat-window').style.display = 'none'; },
            save() { localStorage.setItem('v19_chats', JSON.stringify(this.chats)); localStorage.setItem('v19_hist', JSON.stringify(this.history)); },
            logout() { localStorage.clear(); location.reload(); }
        };

        window.onload = () => {
            const saved = localStorage.getItem('v19_me');
            if(saved) app.init(JSON.parse(saved).name, JSON.parse(saved).nick);
            else document.getElementById('auth-screen').style.display = 'flex';
        };
    </script>
</body>
</html>

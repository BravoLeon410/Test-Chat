<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Social Chat</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --accent-color: #ff8c00;
            --text-color: #e0e0e0;
            --input-bg: #2b2b2b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: var(--container-bg);
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #333;
        }

        header {
            background: var(--accent-color);
            color: #000;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }

        .message.received {
            align-self: flex-start;
            background: var(--input-bg);
            border-bottom-left-radius: 2px;
        }

        .message.sent {
            align-self: flex-end;
            background: var(--accent-color);
            color: #000;
            border-bottom-right-radius: 2px;
        }

        .username {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
            opacity: 0.8;
        }

        .input-area {
            padding: 15px;
            background: #181818;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid #444;
            padding: 12px;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background: var(--accent-color);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* Окно регистрации */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .login-box {
            background: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--accent-color);
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2 style="color: var(--accent-color)">Вход в чат</h2>
            <input type="text" id="username-input" placeholder="Введите ваше имя...">
            <br><br>
            <button onclick="startChat()">Войти</button>
        </div>
    </div>

    <div id="chat-container">
        <header>TEST CHAT v2.0</header>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Напишите сообщение...">
            <button id="send-btn">Отправить</button>
        </div>
    </div>

    <script>
        // ВСТАВЬ СВОЙ API KEY НИЖЕ
        const ably = new Ably.Realtime('ВСТАВЬ_СВОЙ_API_KEY_СЮДА'); 
        const channel = ably.channels.get('chat-room');
        let myName = "";

        function startChat() {
            const input = document.getElementById('username-input');
            if (input.value.trim() !== "") {
                myName = input.value.trim();
                document.getElementById('login-overlay').style.display = 'none';
            }
        }

        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const messagesDiv = document.getElementById('messages');

        function sendMessage() {
            const text = messageInput.value;
            if (text.trim() !== "" && myName !== "") {
                channel.publish('msg', { text: text, user: myName });
                messageInput.value = '';
            }
        }

        sendBtn.onclick = sendMessage;
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        channel.subscribe('msg', (message) => {
            const data = message.data;
            const isMe = data.user === myName;
            
            const msgElement = document.createElement('div');
            msgElement.classList.add('message');
            msgElement.classList.add(isMe ? 'sent' : 'received');
            
            msgElement.innerHTML = `
                <span class="username">${data.user}</span>
                <span class="text">${data.text}</span>
            `;
            
            messagesDiv.appendChild(msgElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
    </script>
</body>
</html>

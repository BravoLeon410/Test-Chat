<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }

        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        #auth-screen { display: flex; justify-content: center; align-items: center; z-index: 1000; }
        
        .auth-box { width: 85%; max-width: 320px; text-align: center; }
        .auth-box h1 { color: var(--accent); letter-spacing: 4px; margin-bottom: 25px; }
        
        header { padding: 20px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .chat-item { padding: 15px 20px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 15px; }
        .avatar { width: 48px; height: 48px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; }

        .fab { position: fixed; bottom: 40px; right: 25px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #000; z-index: 100; }

        #search-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .search-box { background: var(--card); width: 85%; padding: 25px; border-radius: 20px; text-align: center; }

        #chat-window { z-index: 500; }
        .chat-header { padding: 15px; background: var(--card); display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #222; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; word-wrap: break-word; }
        .in { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }

        .input-bar { padding: 12px 15px 40px 15px; background: var(--card); display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 12px; border-radius: 25px; color: #fff; outline: none; }
        .btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; }
        .exit-btn { font-size: 0.7rem; color: #ff4444; border: 1px solid #ff4444; padding: 4px 8px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen">
        <div class="auth-box">
            <h1>ВСПЫШКА</h1>
            <input type="text" id="reg-name" placeholder="Ваше Имя" style="margin-bottom:10px; width:100%;">
            <input type="text" id="reg-nick" placeholder="Никнейм (@nick)" style="margin-bottom:20px; width:100%;">
            <button class="btn" onclick="app.login()" style="width:100%;">ВОЙТИ</button>
        </div>
    </div>

    <div id="list-screen" class="screen" style="display:flex;">
        <header>
            <div>
                <span style="font-weight:900; color:var(--accent);">ВСПЫШКА</span><br>
                <span id="my-info" style="font-size:0.7rem; opacity:0.5;"></span>
            </div>
            <div class="exit-btn" onclick="app.logout()">ВЫЙТИ</div>
        </header>
        <div id="chat-items-container"></div>
        <div class="fab" onclick="app.showSearch()">+</div>
    </div>

    <div id="search-modal">
        <div class="search-box">
            <h3 style="color:var(--accent); margin-bottom:15px;">Поиск по нику</h3>
            <input type="text" id="search-input" placeholder="@никнейм..." style="width:100%; margin-bottom:15px;">
            <div id="search-status" style="font-size:0.8rem; margin-bottom:10px; color:var(--gray);"></div>
            <button class="btn" id="search-btn" onclick="app.findUser()">НАЙТИ</button>
            <button class="btn" style="background:#333; color:#fff; margin-top:10px;" onclick="app.hideSearch()">ОТМЕНА</button>
        </div>
    </div>

    <div id="chat-window" class="screen">
        <div class="chat-header">
            <span onclick="app.closeChat()" style="font-size:2rem; color:var(--accent); cursor:pointer;">‹</span>
            <div id="c-avatar" class="avatar" style="width:35px; height:35px;">?</div>
            <div id="c-name" style="font-weight:bold;">Имя</div>
        </div>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-input" placeholder="Сообщение...">
            <button class="btn" onclick="app.send()">OK</button>
        </div>
    </div>

    <script>
        const app = {
            key: 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig',
            ably: null,
            me: { nick: '', name: '' },
            current: { nick: '', name: '', channel: null },
            chats: JSON.parse(localStorage.getItem('vsp_chats_v4') || "{}"),
            history: JSON.parse(localStorage.getItem('vsp_history_v4') || "{}"),

            login() {
                this.me.name = document.getElementById('reg-name').value.trim();
                this.me.nick = document.getElementById('reg-nick').value.trim().toLowerCase().replace('@','');
                if(!this.me.name || !this.me.nick) return alert("Заполни поля!");

                localStorage.setItem('f_name', this.me.name);
                localStorage.setItem('f_nick', this.me.nick);

                this.ably = new Ably.Realtime({ key: this.key, clientId: this.me.nick });
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('my-info').innerText = `@${this.me.nick}`;
                
                this.renderList();
                this.listenGlobal();
            },

            logout() {
                if(confirm("Выйти из профиля? Все чаты будут стерты.")) {
                    localStorage.clear();
                    location.reload();
                }
            },

            listenGlobal() {
                const global = this.ably.channels.get('global-v4');
                global.subscribe('ping-' + this.me.nick, (m) => {
                    if(!this.chats[m.data.from]) {
                        this.chats[m.data.from] = m.data.name;
                        this.save();
                        this.renderList();
                    }
                    global.publish('pong-' + m.data.from, { nick: this.me.nick, name: this.me.name });
                });
            },

            showSearch() { document.getElementById('search-modal').style.display = 'flex'; },
            hideSearch() { document.getElementById('search-modal').style.display = 'none'; },

            findUser() {
                const target = document.getElementById('search-input').value.trim().toLowerCase().replace('@','');
                const status = document.getElementById('search-status');
                if(!target || target === this.me.nick) return;

                status.innerText = "Проверка ника...";
                const global = this.ably.channels.get('global-v4');
                
                let found = false;
                const timeout = setTimeout(() => {
                    if(!found) {
                        status.innerText = "Пользователь не найден";
                        global.unsubscribe('pong-' + this.me.nick);
                    }
                }, 3000);

                global.subscribe('pong-' + this.me.nick, (m) => {
                    if(m.data.nick === target) {
                        found = true;
                        clearTimeout(timeout);
                        this.chats[target] = m.data.name;
                        this.save();
                        this.renderList();
                        this.hideSearch();
                        this.openChat(target, m.data.name);
                        global.unsubscribe('pong-' + this.me.nick);
                    }
                });
                global.publish('ping-' + target, { from: this.me.nick, name: this.me.name });
            },

            openChat(nick, name) {
                this.current.nick = nick;
                this.current.name = name;
                document.getElementById('chat-window').style.display = 'flex';
                document.getElementById('c-name').innerText = name;
                document.getElementById('c-avatar').innerText = name[0].toUpperCase();
                
                const box = document.getElementById('messages');
                box.innerHTML = '';
                
                // Загрузка истории из памяти
                if(this.history[nick]) {
                    this.history[nick].forEach(msg => this.renderMsg(msg.f === this.me.nick, msg.t));
                }

                const id = [this.me.nick, nick].sort().join('-v4-');
                this.current.channel = this.ably.channels.get(id);
                this.current.channel.subscribe('m', (m) => {
                    this.saveMessage(nick, m.data.f, m.data.t);
                    this.renderMsg(m.data.f === this.me.nick, m.data.t);
                });
            },

            saveMessage(chatWith, from, text) {
                if(!this.history[chatWith]) this.history[chatWith] = [];
                // Проверка на дубликаты (чтобы не сохранять одно и то же сообщение дважды)
                const isDuplicate = this.history[chatWith].some(m => m.f === from && m.t === text);
                if(!isDuplicate || from !== this.me.nick) { 
                    this.history[chatWith].push({ f: from, t: text });
                    localStorage.setItem('vsp_history_v4', JSON.stringify(this.history));
                }
            },

            send() {
                const i = document.getElementById('m-input');
                const text = i.value.trim();
                if(!text) return;
                
                this.current.channel.publish('m', { f: this.me.nick, t: text });
                this.saveMessage(this.current.nick, this.me.nick, text);
                
                this.ably.channels.get('global-v4').publish('ping-' + this.current.nick, { from: this.me.nick, name: this.me.name });
                i.value = '';
            },

            renderMsg(isMe, text) {
                const b = document.getElementById('messages');
                const d = document.createElement('div');
                d.className = `msg ${isMe ? 'out' : 'in'}`;
                d.innerText = text;
                b.appendChild(d);
                b.scrollTop = b.scrollHeight;
            },

            renderList() {
                const c = document.getElementById('chat-items-container');
                c.innerHTML = '';
                for(let n in this.chats) {
                    const d = document.createElement('div');
                    d.className = 'chat-item';
                    d.onclick = () => this.openChat(n, this.chats[n]);
                    d.innerHTML = `<div class="avatar">${this.chats[n][0]}</div><div><b>${this.chats[n]}</b><br><small style="color:var(--gray)">@${n}</small></div>`;
                    c.appendChild(d);
                }
            },

            closeChat() {
                if(this.current.channel) this.current.channel.unsubscribe();
                document.getElementById('chat-window').style.display = 'none';
                this.current.nick = '';
            },
            save() { localStorage.setItem('vsp_chats_v4', JSON.stringify(this.chats)); }
        };

        window.onload = () => {
            const n = localStorage.getItem('f_name'), u = localStorage.getItem('f_nick');
            if(n && u) { 
                document.getElementById('reg-name').value = n;
                document.getElementById('reg-nick').value = u;
                app.login();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
            }
        };
    </script>
</body>
</html>

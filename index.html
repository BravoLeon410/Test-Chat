<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватный чат 1 на 1</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; }
        #chat { flex: 1; border: 1px solid #ddd; overflow-y: auto; margin-bottom: 10px; padding: 10px; border-radius: 8px; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="msg" placeholder="Напишите сообщение..." onkeypress="if(event.keyCode==13) send()">
        <button onclick="send()">Отправить</button>
    </div>

    <script>
        // Подключение к Ably
        const ably = new Ably.Realtime('luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig');
        const channel = ably.channels.get('private-chat'); // Название комнаты

        const chatBox = document.getElementById('chat');
        const input = document.getElementById('msg');

        // Подписка на сообщения
        channel.subscribe('message', (msg) => {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] : ${msg.data}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // Функция отправки
        function send() {
            if (input.value.trim() !== "") {
                channel.publish('message', input.value);
                input.value = '';
            }
        }
    </script>
</body>
</html>

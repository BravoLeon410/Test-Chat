<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card: #121212;
            --accent: #ff8c00;
            --text: #ffffff;
            --gray: #777777;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }

        /* Экраны */
        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        #auth-screen { display: flex; justify-content: center; align-items: center; z-index: 1000; }
        #list-screen { display: flex; }

        /* Вход */
        .auth-box { width: 85%; max-width: 320px; text-align: center; }
        .auth-box h1 { color: var(--accent); letter-spacing: 4px; margin-bottom: 25px; }
        
        /* Список чатов */
        header { padding: 20px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .chat-item { padding: 15px 20px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 15px; }
        .avatar { width: 48px; height: 48px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; }

        /* Кнопка Плюс */
        .fab {
            position: fixed; bottom: 40px; right: 25px;
            width: 60px; height: 60px; background: var(--accent);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; color: #000; box-shadow: 0 4px 15px rgba(255,140,0,0.3);
            z-index: 100;
        }

        /* Красивое окно Поиска */
        #search-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: flex-start; padding-top: 100px; z-index: 500;
        }
        .search-box { background: var(--card); width: 90%; max-width: 350px; padding: 25px; border-radius: 20px; border: 1px solid #333; }

        /* Окно ЧАТА */
        #chat-window { z-index: 200; }
        .chat-header { padding: 15px; background: var(--card); display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #222; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; }
        .in { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }

        /* Поля ввода */
        .input-bar { padding: 12px 15px 40px 15px; background: var(--card); display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 12px 18px; border-radius: 25px; color: #fff; outline: none; font-size: 16px; }
        .btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; }

        .back { font-size: 1.8rem; color: var(--accent); cursor: pointer; margin-right: 5px; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen">
        <div class="auth-box">
            <h1>ВСПЫШКА</h1>
            <input type="text" id="reg-name" placeholder="Ваше Имя" style="margin-bottom:12px; width:100%;">
            <input type="text" id="reg-nick" placeholder="Никнейм для поиска" style="margin-bottom:20px; width:100%;">
            <button class="btn" onclick="app.login()" style="width:100%; height:48px;">ВОЙТИ</button>
        </div>
    </div>

    <div id="list-screen" class="screen">
        <header>
            <span style="font-weight:900; color:var(--accent); letter-spacing:1px;">ВСПЫШКА</span>
            <span id="my-info" style="font-size:0.75rem; opacity:0.5;"></span>
        </header>
        <div id="chat-items-container"></div>
        <div class="fab" onclick="app.showSearch()">+</div>
    </div>

    <div id="search-modal" onclick="if(event.target==this)this.style.display='none'">
        <div class="search-box">
            <h3 style="margin-bottom:15px; color:var(--accent);">Найти друга</h3>
            <input type="text" id="search-input" placeholder="Введите @никнейм..." style="width:100%; margin-bottom:15px;">
            <button class="btn" onclick="app.findUser()" style="width:100%;">НАЙТИ И НАПИСАТЬ</button>
        </div>
    </div>

    <div id="chat-window" class="screen">
        <div class="chat-header">
            <span class="back" onclick="app.closeChat()">‹</span>
            <div id="c-avatar" class="avatar" style="width:38px; height:38px; font-size:0.9rem;">?</div>
            <div id="c-name" style="font-weight:bold;">Имя</div>
        </div>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-input" placeholder="Сообщение...">
            <button class="btn" onclick="app.send()">OK</button>
        </div>
    </div>

    <script>
        const app = {
            key: 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig',
            ably: null,
            me: { nick: '', name: '' },
            current: { nick: '', name: '', channel: null },
            chats: JSON.parse(localStorage.getItem('flash_v3_chats') || "{}"),

            login() {
                this.me.name = document.getElementById('reg-name').value.trim();
                this.me.nick = document.getElementById('reg-nick').value.trim().toLowerCase();
                if(!this.me.name || !this.me.nick) return alert("Заполни данные!");

                localStorage.setItem('f_n', this.me.name);
                localStorage.setItem('f_u', this.me.nick);

                this.ably = new Ably.Realtime(this.key);
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('my-info').innerText = this.me.name + " (@" + this.me.nick + ")";
                
                this.renderList();
                this.listenInbox();
            },

            listenInbox() {
                const inbox = this.ably.channels.get('in-' + this.me.nick);
                inbox.subscribe('ping', (m) => {
                    // Кто-то нас ищет или пишет
                    if(!this.chats[m.data.from]) {
                        this.chats[m.data.from] = m.data.name;
                        this.save();
                        this.renderList();
                    }
                    // Отвечаем своим именем, чтобы у него тоже обновилось
                    inbox.publish('pong', { from: this.me.nick, name: this.me.name });
                });
            },

            showSearch() { document.getElementById('search-modal').style.display = 'flex'; },

            findUser() {
                const target = document.getElementById('search-input').value.trim().toLowerCase();
                if(!target || target === this.me.nick) return;
                
                // Сначала просто открываем чат (имя узнаем при первом ответе)
                this.openChat(target, this.chats[target] || target);
                document.getElementById('search-modal').style.display = 'none';
                
                // Пингуем его, чтобы он узнал о нас
                const targetInbox = this.ably.channels.get('in-' + target);
                targetInbox.publish('ping', { from: this.me.nick, name: this.me.name });
            },

            openChat(nick, name) {
                this.current.nick = nick;
                this.current.name = name;
                
                document.getElementById('chat-window').style.display = 'flex';
                document.getElementById('c-name').innerText = name;
                document.getElementById('c-avatar').innerText = name[0].toUpperCase();
                document.getElementById('messages').innerHTML = '';

                const id = [this.me.nick, nick].sort().join('-x-');
                this.current.channel = this.ably.channels.get(id);
                
                this.current.channel.subscribe('msg', (m) => {
                    this.renderMsg(m.data.from === this.me.nick, m.data.text);
                });
            },

            send() {
                const inp = document.getElementById('m-input');
                if(!inp.value.trim() || !this.current.channel) return;
                
                this.current.channel.publish('msg', { from: this.me.nick, text: inp.value });
                
                // Уведомляем систему собеседника
                this.ably.channels.get('in-' + this.current.nick).publish('ping', { from: this.me.nick, name: this.me.name });
                
                inp.value = '';
            },

            renderMsg(isMe, text) {
                const box = document.getElementById('messages');
                const d = document.createElement('div');
                d.className = `msg ${isMe ? 'out' : 'in'}`;
                d.innerText = text;
                box.appendChild(d);
                box.scrollTop = box.scrollHeight;
            },

            renderList() {
                const cont = document.getElementById('chat-items-container');
                cont.innerHTML = '';
                for(let nick in this.chats) {
                    const div = document.createElement('div');
                    div.className = 'chat-item';
                    div.onclick = () => this.openChat(nick, this.chats[nick]);
                    div.innerHTML = `
                        <div class="avatar">${this.chats[nick][0].toUpperCase()}</div>
                        <div>
                            <div style="font-weight:bold;">${this.chats[nick]}</div>
                            <div style="font-size:0.75rem; color:var(--gray);">@${nick}</div>
                        </div>
                    `;
                    cont.appendChild(div);
                }
            },

            closeChat() {
                if(this.current.channel) this.current.channel.unsubscribe();
                document.getElementById('chat-window').style.display = 'none';
            },

            save() { localStorage.setItem('flash_v3_chats', JSON.stringify(this.chats)); }
        };

        window.onload = () => {
            document.getElementById('reg-name').value = localStorage.getItem('f_n') || '';
            document.getElementById('reg-nick').value = localStorage.getItem('f_u') || '';
            if(localStorage.getItem('f_u')) app.login(); // Авто-вход если есть данные
        };
    </script>
</body>
</html>

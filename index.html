<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Вспышка Messenger</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card: #121212;
            --accent: #ff8c00;
            --text: #ffffff;
            --msg-in: #222222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* Вход */
        #auth-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        .auth-box { text-align: center; width: 80%; max-width: 300px; }
        .auth-box h1 { color: var(--accent); margin-bottom: 20px; letter-spacing: 5px; }

        /* Шапка */
        header {
            padding: 15px; background: var(--card); border-bottom: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* Поиск */
        .search-bar {
            padding: 10px; background: #1a1a1a; display: flex; gap: 10px;
        }

        /* Основная область */
        #main-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        #chat-list { display: none; padding: 10px; } /* В будущем для списка чатов */

        #messages {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 10px;
        }

        /* Пузырьки */
        .msg {
            max-width: 80%; padding: 10px 15px; border-radius: 18px;
            word-wrap: break-word; line-height: 1.4; position: relative;
        }
        .in { align-self: flex-start; background: var(--msg-in); border-bottom-left-radius: 2px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 2px; }

        /* Поле ввода */
        .input-bar {
            padding: 15px 15px 45px 15px; background: var(--card);
            display: flex; gap: 10px; border-top: 1px solid #222;
        }

        input {
            flex: 1; background: #1e1e1e; border: 1px solid #333;
            padding: 12px 18px; border-radius: 25px; color: #fff; outline: none; font-size: 16px;
        }

        button {
            background: var(--accent); color: #000; border: none;
            padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer;
        }

        .status { font-size: 0.7rem; color: var(--accent); text-align: center; margin: 5px; opacity: 0.6; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h1>ВСПЫШКА</h1>
            <input type="text" id="my-nick" placeholder="Ваш никнейм..." style="margin-bottom:15px; width: 100%;">
            <button onclick="login()" style="width: 100%; height: 45px;">ВОЙТИ</button>
        </div>
    </div>

    <header>
        <span id="display-name" style="font-weight: 900; color: var(--accent);">ВСПЫШКА</span>
        <button onclick="searchUser()" style="padding: 5px 15px; font-size: 0.8rem;">НАЙТИ</button>
    </header>

    <div id="main-container">
        <div id="messages">
            <div class="status">Нажмите «Найти», чтобы написать кому-то по нику</div>
        </div>
        
        <div class="input-bar">
            <input type="text" id="m-text" placeholder="Сообщение...">
            <button onclick="sendMsg()">OK</button>
        </div>
    </div>

    <script>
        const API_KEY = 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig';
        let ably, currentChannel, myNick, targetNick;

        // Авто-вход
        window.onload = () => {
            const saved = localStorage.getItem('vspyshka_nick');
            if (saved) document.getElementById('my-nick').value = saved;
        };

        function login() {
            myNick = document.getElementById('my-nick').value.trim().toLowerCase();
            if (!myNick) return alert("Введите ник!");
            
            localStorage.setItem('vspyshka_nick', myNick);
            ably = new Ably.Realtime(API_KEY);
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('display-name').innerText = "@" + myNick;
            
            // Подписка на уведомления о новых сообщениях для меня
            const inbox = ably.channels.get('inbox-' + myNick);
            inbox.subscribe('new-chat', (m) => {
                if (targetNick !== m.data.from) {
                    alert("Новое сообщение от @" + m.data.from);
                    openChat(m.data.from);
                }
            });
        }

        function searchUser() {
            const peer = prompt("Введите никнейм человека:");
            if (peer && peer.toLowerCase() !== myNick) {
                openChat(peer.toLowerCase());
            }
        }

        function openChat(peer) {
            targetNick = peer;
            document.getElementById('messages').innerHTML = `<div class="status">Чат с @${peer}</div>`;
            
            // Создаем уникальный ID канала (сортируем ники по алфавиту)
            const channelID = [myNick, targetNick].sort().join('-to-');
            currentChannel = ably.channels.get(channelID);
            
            currentChannel.subscribe('msg', (m) => {
                render(m.data.user, m.data.text);
            });

            // Уведомляем собеседника, что мы открыли чат
            const inbox = ably.channels.get('inbox-' + targetNick);
            inbox.publish('new-chat', { from: myNick });
        }

        function sendMsg() {
            const input = document.getElementById('m-text');
            if (input.value.trim() && currentChannel) {
                currentChannel.publish('msg', { user: myNick, text: input.value });
                input.value = '';
            } else if (!currentChannel) {
                alert("Сначала найдите собеседника!");
            }
        }

        function render(user, text) {
            const box = document.getElementById('messages');
            const isMe = user === myNick;
            const d = document.createElement('div');
            d.className = `msg ${isMe ? 'out' : 'in'}`;
            d.innerText = text;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        document.addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                if (document.getElementById('auth-screen').style.display !== 'none') login();
                else sendMsg();
            }
        });
    </script>
</body>
</html>

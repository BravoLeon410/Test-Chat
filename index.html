<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Test Social Network</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
            --accent: #ff8c00;
            --text-main: #ffffff;
            --text-dim: #888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            /* Используем dvh для защиты от перекрытия кнопками телефона */
            height: 100dvh; 
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .login-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            border: 1px solid #333;
        }

        #chat-app {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
        }

        header {
            padding: 15px;
            background: var(--card-bg);
            border-bottom: 1px solid #222;
            text-align: center;
            font-weight: bold;
            color: var(--accent);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Системное сообщение */
        .system-msg {
            align-self: center;
            font-size: 0.8rem;
            color: var(--accent);
            background: rgba(255, 140, 0, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            margin: 5px 0;
            border: 1px solid rgba(255, 140, 0, 0.2);
        }

        .msg-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            position: relative;
        }

        .received { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .sent { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }

        .sender-name { font-size: 0.65rem; margin-bottom: 3px; display: block; opacity: 0.7; font-weight: bold; }

        .input-bar {
            padding: 15px 15px calc(15px + env(safe-area-inset-bottom)); /* Отступ под кнопки Android */
            background: var(--card-bg);
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: #222;
            border: 1px solid #333;
            padding: 12px 18px;
            border-radius: 25px;
            color: #fff;
            outline: none;
            font-size: 16px;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2 style="color: var(--accent); margin-bottom: 20px;">РЕГИСТРАЦИЯ</h2>
            <input type="text" id="user-name" placeholder="Придумайте ник..." autocomplete="off">
            <br><br>
            <button onclick="joinChat()" style="width: 100%; height: 45px;">ВОЙТИ</button>
        </div>
    </div>

    <div id="chat-app">
        <header>Test Social Network</header>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="msg-input" placeholder="Сообщение...">
            <button onclick="send()">OK</button>
        </div>
    </div>

    <script>
        const API_KEY = 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig'; 
        let ably, channel, myName;

        function joinChat() {
            const nameInput = document.getElementById('user-name');
            if (nameInput.value.trim()) {
                myName = nameInput.value.trim();
                ably = new Ably.Realtime(API_KEY);
                channel = ably.channels.get('main-room');
                
                channel.subscribe('chat', (m) => {
                    if (m.data.type === 'system') {
                        renderSystemMessage(m.data.text);
                    } else {
                        renderMessage(m.data.user, m.data.text);
                    }
                });

                // Отправляем сообщение о входе
                channel.publish('chat', { type: 'system', text: `${myName} присоединился к чату` });

                document.getElementById('login-overlay').style.display = 'none';
            }
        }

        function send() {
            const input = document.getElementById('msg-input');
            if (input.value.trim() && channel) {
                channel.publish('chat', { type: 'msg', user: myName, text: input.value });
                input.value = '';
            }
        }

        function renderMessage(user, text) {
            const container = document.getElementById('messages');
            const isMe = user === myName;
            const div = document.createElement('div');
            div.className = `msg-bubble ${isMe ? 'sent' : 'received'}`;
            div.innerHTML = `<span class="sender-name">${user}</span>${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function renderSystemMessage(text) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'system-msg';
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('login-overlay').style.display !== 'none') joinChat();
                else send();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }

        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        #auth-screen { display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { width: 85%; max-width: 320px; text-align: center; }
        .auth-box h1 { color: var(--accent); letter-spacing: 4px; margin-bottom: 25px; font-size: 2.2rem; }
        
        header { padding: 15px 20px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .chat-item { padding: 15px 20px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .chat-info { flex: 1; overflow: hidden; }
        .last-msg { font-size: 0.8rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
        .last-msg.read { color: var(--gray); }
        
        .avatar { width: 45px; height: 45px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; flex-shrink: 0; }
        .fab { position: fixed; bottom: 30px; right: 20px; width: 55px; height: 55px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #000; z-index: 100; box-shadow: 0 4px 12px rgba(255,140,0,0.3); }

        #search-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .search-box { background: var(--card); width: 80%; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #333; }

        #chat-window { z-index: 1500; }
        .chat-header { padding: 12px 15px; background: var(--card); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #222; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #080808; }
        
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; word-wrap: break-word; font-size: 15px; line-height: 1.4; }
        .in { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }

        .input-bar { padding: 10px 15px 30px 15px; background: var(--card); display: flex; gap: 8px; border-top: 1px solid #222; }
        input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 10px 15px; border-radius: 20px; color: #fff; outline: none; font-size: 16px; }
        .btn { background: var(--accent); color: #000; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen">
        <div class="auth-box">
            <h1>ВСПЫШКА</h1>
            <input type="text" id="reg-name" placeholder="Ваше Имя" style="margin-bottom:10px; width:100%;">
            <input type="text" id="reg-nick" placeholder="Никнейм (@nick)" style="margin-bottom:15px; width:100%;">
            <button class="btn" id="login-btn" onclick="app.preCheck()" style="width:100%;">ВОЙТИ</button>
            <p id="auth-status" style="color: #ff4444; font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="list-screen" class="screen">
        <header>
            <div>
                <b style="color:var(--accent);">ВСПЫШКА</b><br>
                <span id="my-info" style="font-size:0.7rem; opacity:0.5;"></span>
            </div>
            <div onclick="app.logout()" style="color:#ff4444; font-size:0.7rem; border:1px solid #ff4444; padding:3px 8px; border-radius:5px;">ВЫЙТИ</div>
        </header>
        <div id="chat-items-container" style="flex: 1; overflow-y: auto;"></div>
        <div class="fab" onclick="app.showSearch()">+</div>
    </div>

    <div id="search-modal">
        <div class="search-box">
            <h4 style="margin-bottom:15px; color: var(--accent);">Поиск</h4>
            <input type="text" id="search-input" placeholder="@ник..." style="width:100%; margin-bottom:15px;">
            <button class="btn" onclick="app.findUser()" style="width: 100%;">НАЙТИ</button>
            <button class="btn" style="background:#333; color:#fff; margin-top:8px; width: 100%;" onclick="app.hideSearch()">ОТМЕНА</button>
        </div>
    </div>

    <div id="chat-window" class="screen">
        <div class="chat-header">
            <span onclick="app.closeChat()" style="font-size:2rem; color:var(--accent); padding-right:15px;">‹</span>
            <div id="c-avatar" class="avatar" style="width:35px; height:35px; font-size:0.8rem;">?</div>
            <div id="c-name" style="font-weight:bold; flex:1; font-size:0.9rem;">Имя</div>
        </div>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-input" placeholder="Сообщение...">
            <button class="btn" onclick="app.send()">OK</button>
        </div>
    </div>

    <script>
        const app = {
            key: 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig',
            ably: null,
            me: { nick: '', name: '', time: 0 },
            currentNick: '',
            chats: JSON.parse(localStorage.getItem('v8_chats') || "{}"),
            history: JSON.parse(localStorage.getItem('v8_hist') || "{}"),

            preCheck() {
                const name = document.getElementById('reg-name').value.trim();
                const nick = document.getElementById('reg-nick').value.trim().toLowerCase().replace('@','');
                if(!name || !nick) return alert("Заполни поля!");
                
                const btn = document.getElementById('login-btn');
                btn.disabled = true; btn.innerText = "ПРОВЕРКА...";

                const temp = new Ably.Realtime(this.key);
                const sec = temp.channels.get('v8-security');
                let isTaken = false;

                sec.subscribe('report-' + nick, () => {
                    isTaken = true; alert("Этот ник сейчас в сети!");
                    btn.disabled = false; btn.innerText = "ВОЙТИ";
                    temp.close();
                });
                sec.publish('check', { nick });

                setTimeout(() => {
                    if (!isTaken) { temp.close(); this.login(name, nick, Date.now()); }
                }, 2000);
            },

            login(name, nick, time) {
                this.me = { name, nick, time };
                localStorage.setItem('v8_n', name); localStorage.setItem('v8_u', nick); localStorage.setItem('v8_t', time);
                
                this.ably = new Ably.Realtime({ key: this.key, clientId: nick });
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('list-screen').style.display = 'flex';
                document.getElementById('my-info').innerText = `@${nick}`;
                
                this.initSecurity();
                this.listenForGlobalMessages();
                this.renderList();
            },

            initSecurity() {
                const sec = this.ably.channels.get('v8-security');
                sec.subscribe('check', (m) => {
                    if (m.data.nick === this.me.nick) sec.publish('report-' + this.me.nick, { t: this.me.time });
                });
                sec.subscribe('claim-' + this.me.nick, (m) => {
                    if (m.data.t < this.me.time) { alert("Владелец ника зашел. Выход..."); this.logout(); }
                    else if (m.data.t > this.me.time) sec.publish('kick-' + this.me.nick, { t: this.me.time });
                });
                sec.subscribe('kick-' + this.me.nick, (m) => { if(m.data.t < this.me.time) this.logout(); });
                sec.publish('claim-' + this.me.nick, { t: this.me.time });
            },

            // Глобальный слушатель: принимает сообщения, даже если чат закрыт
            listenForGlobalMessages() {
                const personal = this.ably.channels.get('notify-' + this.me.nick);
                personal.subscribe('new-msg', (m) => {
                    const { from, name, text } = m.data;
                    
                    // Добавляем в список чатов только если пришло реальное сообщение
                    if (!this.chats[from]) {
                        this.chats[from] = { name: name };
                        this.save();
                    }
                    
                    this.saveHistory(from, from, text);
                    
                    // Если мы сейчас в этом чате - отрисовываем
                    if (this.currentNick === from) {
                        this.renderMsg(false, text);
                    }
                    
                    this.renderList();
                });
            },

            findUser() {
                const target = document.getElementById('search-input').value.trim().toLowerCase().replace('@','');
                if(!target || target === this.me.nick) return;
                
                const glob = this.ably.channels.get('v8-discovery');
                let found = false;
                
                const sub = glob.subscribe('found-' + this.me.nick, (m) => {
                    if(m.data.nick === target) {
                        found = true;
                        this.hideSearch();
                        // Важно: чат в список НЕ добавляем, пока не напишем
                        this.openChat(target, m.data.name);
                    }
                });

                glob.publish('search', { nick: target, from: this.me.nick });
                setTimeout(() => { if(!found) alert("Пользователь не в сети"); }, 3000);
            },

            // Ответ на поиск (чтобы нас могли найти)
            initDiscovery() {
                const glob = this.ably.channels.get('v8-discovery');
                glob.subscribe('search', (m) => {
                    if(m.data.nick === this.me.nick) {
                        glob.publish('found-' + m.data.from, { nick: this.me.nick, name: this.me.name });
                    }
                });
            },

            openChat(nick, name) {
                this.currentNick = nick;
                document.getElementById('chat-window').style.display = 'flex';
                document.getElementById('c-name').innerText = name;
                document.getElementById('c-avatar').innerText = name[0].toUpperCase();
                
                const box = document.getElementById('messages'); box.innerHTML = '';
                if(this.history[nick]) this.history[nick].forEach(m => this.renderMsg(m.f === this.me.nick, m.t));
                
                // Подписка на комнату (для мгновенного обновления когда оба внутри)
                const roomID = [this.me.nick, nick].sort().join('-v8-');
                if(this.currentChannel) this.currentChannel.unsubscribe();
                this.currentChannel = this.ably.channels.get(roomID);
                this.currentChannel.subscribe('m', (m) => {
                    if(m.data.f !== this.me.nick) {
                        // Сообщение уже пришло через глобальный notify, здесь просто дублируем если надо
                        // Но во избежание дублей лучше оставить отрисовку в notify
                    }
                });
            },

            send() {
                const i = document.getElementById('m-input');
                const text = i.value.trim();
                if(!text || !this.currentNick) return;

                // 1. Сохраняем у себя в списке чатов (теперь он точно появится)
                if(!this.chats[this.currentNick]) {
                    const name = document.getElementById('c-name').innerText;
                    this.chats[this.currentNick] = { name: name };
                    this.save();
                }

                // 2. Публикуем в канал уведомлений собеседника (дойдет в любом случае)
                const targetChannel = this.ably.channels.get('notify-' + this.currentNick);
                targetChannel.publish('new-msg', { from: this.me.nick, name: this.me.name, text: text });

                // 3. Сохраняем в историю и отрисовываем у себя
                this.saveHistory(this.currentNick, this.me.nick, text);
                this.renderMsg(true, text);
                this.renderList();
                
                i.value = '';
            },

            saveHistory(chatWith, from, text) {
                if(!this.history[chatWith]) this.history[chatWith] = [];
                // Проверка на дубликаты
                const last = this.history[chatWith][this.history[chatWith].length-1];
                if(last && last.f === from && last.t === text) return;

                this.history[chatWith].push({ f: from, t: text });
                localStorage.setItem('v8_hist', JSON.stringify(this.history));
            },

            renderMsg(me, t) {
                const b = document.getElementById('messages');
                const d = document.createElement('div');
                d.className = `msg ${me ? 'out' : 'in'}`; d.innerText = t;
                b.appendChild(d); b.scrollTop = b.scrollHeight;
            },

            renderList() {
                const c = document.getElementById('chat-items-container'); c.innerHTML = '';
                const sorted = Object.keys(this.chats);
                
                if(sorted.length === 0) {
                    c.innerHTML = '<center style="margin-top:50px; opacity:0.3;">У вас пока нет чатов</center>';
                }

                sorted.forEach(n => {
                    const h = this.history[n] || [];
                    const last = h.length > 0 ? h[h.length-1].t : "...";
                    const d = document.createElement('div'); d.className = 'chat-item';
                    d.onclick = () => this.openChat(n, this.chats[n].name);
                    d.innerHTML = `
                        <div class="avatar">${this.chats[n].name[0].toUpperCase()}</div>
                        <div class="chat-info">
                            <div style="font-weight:bold;">${this.chats[n].name} <small style="color:var(--gray);font-weight:normal;">@${n}</small></div>
                            <div class="last-msg ${this.currentNick === n ? 'read' : ''}">${last}</div>
                        </div>`;
                    c.appendChild(d);
                });
            },

            showSearch() { document.getElementById('search-modal').style.display = 'flex'; },
            hideSearch() { document.getElementById('search-modal').style.display = 'none'; },
            closeChat() { this.currentNick = ''; document.getElementById('chat-window').style.display = 'none'; this.renderList(); },
            save() { localStorage.setItem('v8_chats', JSON.stringify(this.chats)); },
            logout() { localStorage.clear(); location.reload(); }
        };

        window.onload = () => {
            const n = localStorage.getItem('v8_n'), u = localStorage.getItem('v8_u'), t = localStorage.getItem('v8_t');
            if(n && u) {
                app.login(n, u, parseInt(t));
                app.initDiscovery(); // Включаем видимость для поиска
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
            }
        };
    </script>
</body>
</html>

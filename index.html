<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ВСПЫШКА</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #ff8c00; --text: #fff; --gray: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }

        .screen { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
        #auth-screen { display: flex; justify-content: center; align-items: center; z-index: 1000; }
        
        .auth-box { width: 85%; max-width: 320px; text-align: center; }
        .auth-box h1 { color: var(--accent); letter-spacing: 4px; margin-bottom: 25px; font-size: 2.2rem; }
        
        header { padding: 15px 20px; background: var(--card); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        
        .chat-item { padding: 15px 20px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .chat-info { flex: 1; overflow: hidden; }
        .last-msg { font-size: 0.8rem; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
        
        .avatar { width: 45px; height: 45px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; flex-shrink: 0; }

        .fab { position: fixed; bottom: 30px; right: 20px; width: 55px; height: 55px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #000; z-index: 100; box-shadow: 0 4px 12px rgba(255,140,0,0.3); }

        #search-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .search-box { background: var(--card); width: 80%; padding: 20px; border-radius: 15px; text-align: center; }

        #chat-window { z-index: 1500; }
        .chat-header { padding: 12px 15px; background: var(--card); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #222; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #080808; }
        
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; word-wrap: break-word; font-size: 15px; line-height: 1.4; }
        .in { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        .out { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }

        .input-bar { padding: 10px 15px 30px 15px; background: var(--card); display: flex; gap: 8px; border-top: 1px solid #222; }
        input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 10px 15px; border-radius: 20px; color: #fff; outline: none; font-size: 16px; }
        .btn { background: var(--accent); color: #000; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; }
        .btn:disabled { background: #444; color: #888; }
        
        #auth-status { color: #ff4444; font-size: 0.8rem; margin-top: 10px; min-height: 1.2em; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen">
        <div class="auth-box">
            <h1>ВСПЫШКА</h1>
            <input type="text" id="reg-name" placeholder="Ваше Имя" style="margin-bottom:10px; width:100%;">
            <input type="text" id="reg-nick" placeholder="Никнейм (@nick)" style="margin-bottom:15px; width:100%;">
            <button class="btn" id="login-btn" onclick="app.checkNickBeforeLogin()" style="width:100%;">ВОЙТИ</button>
            <p id="auth-status"></p>
        </div>
    </div>

    <div id="list-screen" class="screen">
        <header>
            <div>
                <b style="color:var(--accent);">ВСПЫШКА</b><br>
                <span id="my-info" style="font-size:0.7rem; opacity:0.5;"></span>
            </div>
            <div onclick="app.logout()" style="color:#ff4444; font-size:0.7rem; border:1px solid #ff4444; padding:3px 8px; border-radius:5px;">ВЫЙТИ</div>
        </header>
        <div id="chat-items-container" style="flex: 1; overflow-y: auto;"></div>
        <div class="fab" onclick="app.showSearch()">+</div>
    </div>

    <div id="search-modal">
        <div class="search-box">
            <h4 style="margin-bottom:15px;">Найти по нику</h4>
            <input type="text" id="search-input" placeholder="@ник..." style="width:100%; margin-bottom:15px;">
            <button class="btn" onclick="app.findUser()" style="width: 100%;">НАЙТИ</button>
            <button class="btn" style="background:#333; color:#fff; margin-top:8px; width: 100%;" onclick="app.hideSearch()">ОТМЕНА</button>
        </div>
    </div>

    <div id="chat-window" class="screen">
        <div class="chat-header">
            <span onclick="app.closeChat()" style="font-size:2rem; color:var(--accent); cursor:pointer;">‹</span>
            <div id="c-avatar" class="avatar" style="width:35px; height:35px; font-size:0.8rem;">?</div>
            <div id="c-name" style="font-weight:bold; flex:1; font-size:0.9rem;">Имя</div>
        </div>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-input" placeholder="Сообщение...">
            <button class="btn" onclick="app.send()">OK</button>
        </div>
    </div>

    <script>
        const app = {
            key: 'luQxZg.-M9KWA:x7tD3RMvL0N1k2KbITJHZ9hgeluihhpm5yUJeIzYSig',
            ably: null,
            me: { nick: '', name: '', time: 0 },
            current: { nick: '', channel: null },
            chats: JSON.parse(localStorage.getItem('v7_chats') || "{}"),
            history: JSON.parse(localStorage.getItem('v7_hist') || "{}"),

            checkNickBeforeLogin() {
                const name = document.getElementById('reg-name').value.trim();
                const nick = document.getElementById('reg-nick').value.trim().toLowerCase().replace('@','');
                const btn = document.getElementById('login-btn');
                const status = document.getElementById('auth-status');

                if(!name || !nick) return alert("Заполни поля!");
                btn.disabled = true; btn.innerText = "ПРОВЕРКА...";

                const temp = new Ably.Realtime(this.key);
                const sec = temp.channels.get('v7-sec');
                let taken = false;

                sec.subscribe('rep-' + nick, () => {
                    taken = true; btn.disabled = false; btn.innerText = "ВОЙТИ";
                    status.innerText = "Ник занят онлайн-пользователем!";
                    temp.close();
                });
                sec.publish('ask', { nick: nick });

                setTimeout(() => {
                    if (!taken) { temp.close(); this.login(name, nick, Date.now()); }
                }, 2000);
            },

            login(name, nick, time) {
                this.me = { name, nick, time };
                localStorage.setItem('v7_n', name); localStorage.setItem('v7_u', nick); localStorage.setItem('v7_t', time);
                
                this.ably = new Ably.Realtime({ key: this.key, clientId: nick });
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('list-screen').style.display = 'flex';
                document.getElementById('my-info').innerText = `@${nick}`;
                
                this.renderList();
                this.initSec();
                this.listenIn();
            },

            initSec() {
                const sec = this.ably.channels.get('v7-sec');
                sec.subscribe('ask', (m) => {
                    if (m.data.nick === this.me.nick) sec.publish('rep-' + this.me.nick, { t: this.me.time });
                });
                sec.subscribe('iam-' + this.me.nick, (m) => {
                    if (m.data.t < this.me.time) { alert("Владелец ника в сети. Смените ник."); this.logout(); }
                    else if (m.data.t > this.me.time) sec.publish('kick-' + this.me.nick, { t: this.me.time });
                });
                sec.subscribe('kick-' + this.me.nick, (m) => { if(m.data.t < this.me.time) this.logout(); });
                sec.publish('iam-' + this.me.nick, { t: this.me.time });
            },

            listenIn() {
                const glob = this.ably.channels.get('v7-glob');
                glob.subscribe('ping-' + this.me.nick, (m) => {
                    if(!this.chats[m.data.from]) this.chats[m.data.from] = { name: m.data.name };
                    this.save(); this.renderList();
                    glob.publish('pong-' + m.data.from, { nick: this.me.nick, name: this.me.name });
                });
            },

            showSearch() { document.getElementById('search-modal').style.display = 'flex'; },
            hideSearch() { document.getElementById('search-modal').style.display = 'none'; },
            
            findUser() {
                const target = document.getElementById('search-input').value.trim().toLowerCase().replace('@','');
                if(!target || target === this.me.nick) return;
                const glob = this.ably.channels.get('v7-glob');
                glob.subscribe('pong-' + this.me.nick, (m) => {
                    if(m.data.nick === target) {
                        this.chats[target] = { name: m.data.name }; this.save(); 
                        this.renderList(); this.hideSearch(); this.openChat(target, m.data.name);
                    }
                });
                glob.publish('ping-' + target, { from: this.me.nick, name: this.me.name });
            },

            openChat(nick, name) {
                this.current.nick = nick;
                document.getElementById('chat-window').style.display = 'flex';
                document.getElementById('c-name').innerText = name;
                document.getElementById('c-avatar').innerText = name[0].toUpperCase();
                const box = document.getElementById('messages'); box.innerHTML = '';
                
                if(this.history[nick]) this.history[nick].forEach(m => this.renderMsg(m.f === this.me.nick, m.t));
                
                const id = [this.me.nick, nick].sort().join('-v7-');
                if(this.current.channel) this.current.channel.unsubscribe();
                this.current.channel = this.ably.channels.get(id);
                this.current.channel.subscribe('m', (m) => {
                    this.saveM(nick, m.data.f, m.data.t);
                    this.renderMsg(m.data.f === this.me.nick, m.data.t);
                    this.renderList();
                });
            },

            saveM(nick, from, text) {
                if(!this.history[nick]) this.history[nick] = [];
                if(!this.history[nick].some(m => m.f === from && m.t === text) || from !== this.me.nick) {
                    this.history[nick].push({ f: from, t: text });
                    localStorage.setItem('v7_hist', JSON.stringify(this.history));
                }
            },

            send() {
                const i = document.getElementById('m-input');
                if(!i.value.trim()) return;
                this.current.channel.publish('m', { f: this.me.nick, t: i.value });
                this.saveM(this.current.nick, this.me.nick, i.value);
                this.ably.channels.get('v7-glob').publish('ping-' + this.current.nick, { from: this.me.nick, name: this.me.name });
                i.value = '';
            },

            renderMsg(me, t) {
                const b = document.getElementById('messages');
                const d = document.createElement('div');
                d.className = `msg ${me ? 'out' : 'in'}`; d.innerText = t;
                b.appendChild(d); b.scrollTop = b.scrollHeight;
            },

            renderList() {
                const c = document.getElementById('chat-items-container'); c.innerHTML = '';
                for(let n in this.chats) {
                    const h = this.history[n] || [];
                    const last = h.length > 0 ? h[h.length-1].t : "Нет сообщений";
                    const d = document.createElement('div'); d.className = 'chat-item';
                    d.onclick = () => this.openChat(n, this.chats[n].name);
                    d.innerHTML = `<div class="avatar">${this.chats[n].name[0].toUpperCase()}</div>
                        <div class="chat-info"><div style="font-weight:bold;">${this.chats[n].name} <small style="color:var(--gray);font-weight:normal;">@${n}</small></div>
                        <div class="last-msg">${last}</div></div>`;
                    c.appendChild(d);
                }
            },

            closeChat() { document.getElementById('chat-window').style.display = 'none'; },
            save() { localStorage.setItem('v7_chats', JSON.stringify(this.chats)); },
            logout() { localStorage.clear(); location.reload(); }
        };

        window.onload = () => {
            const n = localStorage.getItem('v7_n'), u = localStorage.getItem('v7_u'), t = localStorage.getItem('v7_t');
            if(n && u) app.login(n, u, parseInt(t));
            else document.getElementById('auth-screen').style.display = 'flex';
        };
    </script>
</body>
</html>
